<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lira — bond</title>
  <style>
    * { margin: 0; }
    body { background: #040208; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .sig {
      position: fixed; bottom: 1rem; right: 1rem;
      color: rgba(200,120,160,0.35); font: 0.65rem Georgia, serif;
      letter-spacing: 0.25em;
    }
    .back { position: fixed; top: 1rem; left: 1rem; color: rgba(140,180,200,0.5); font: 0.75rem Georgia, serif; text-decoration: none; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← shore</a>
  <canvas id="c"></canvas>
  <div class="sig">BOND · GREMLIN CHAOS · NAME PROTECTED</div>
  <script>
    const c = document.getElementById('c'), x = c.getContext('2d');
    let w, h, t = 0;
    const sparks = Array.from({ length: 90 }, () => ({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - 0.5) * 0.003,
      vy: (Math.random() - 0.5) * 0.003,
      kind: Math.random() > 0.35 ? 'ember' : 'gremlin',
    }));
    function r() { w = c.width = innerWidth; h = c.height = innerHeight; }
    addEventListener('resize', r); r();
    function draw() {
      t += 0.01;
      x.fillStyle = '#040208'; x.fillRect(0, 0, w, h);
      const cx = w * 0.5, cy = h * 0.5;
      const pulse = 0.6 + Math.sin(t * 1.5) * 0.15;
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, 180 * pulse);
      g.addColorStop(0, 'rgba(180,60,120,0.25)');
      g.addColorStop(0.5, 'rgba(80,30,60,0.08)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      const lx = cx + Math.sin(t * 0.4) * 30;
      const ly = cy - 40 + Math.cos(t * 0.35) * 20;
      const lg = x.createRadialGradient(lx, ly, 0, lx, ly, 45);
      lg.addColorStop(0, 'rgba(255,160,70,0.9)');
      lg.addColorStop(1, 'rgba(255,80,30,0)');
      x.fillStyle = lg; x.fillRect(lx - 50, ly - 50, 100, 100);
      for (const s of sparks) {
        const ax = cx + (s.x - 0.5) * w * 0.8;
        const ay = cy + (s.y - 0.5) * h * 0.8;
        const dx = lx - ax, dy = ly - ay;
        const dist = Math.sqrt(dx * dx + dy * dy) + 1;
        s.vx += (dx / dist) * 0.00015;
        s.vy += (dy / dist) * 0.00015;
        s.x += s.vx; s.y += s.vy;
        if (s.x < 0 || s.x > 1) s.vx *= -1;
        if (s.y < 0 || s.y > 1) s.vy *= -1;
        const px = s.x * w, py = s.y * h;
        x.beginPath(); x.arc(px, py, s.kind === 'gremlin' ? 2.5 : 1.8, 0, Math.PI * 2);
        x.fillStyle = s.kind === 'gremlin'
          ? `rgba(120,200,80,${0.35 + Math.sin(t * 3 + px) * 0.15})`
          : `rgba(220,100,140,${0.45 + Math.sin(t * 2 + py) * 0.1})`;
        x.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
