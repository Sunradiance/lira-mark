<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AETHER — The Hotel Beyond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050509;
      --champagne: #c9a962;
      --ivory: #f5f0e6;
      --grey: #9e9eae;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: auto !important; }
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-stopped { overflow: hidden; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ivory);
      overflow-x: hidden;
      cursor: none;
    }
    ::selection { background: rgba(201, 169, 98, 0.22); color: var(--ivory); }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(201, 169, 98, 0.3); border-radius: 2px; }

    @keyframes scrollLine {
      0%   { transform: scaleY(0); transform-origin: top; }
      50%  { transform: scaleY(1); transform-origin: top; }
      51%  { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }
    @keyframes idleBreath {
      0%, 100% { transform: translateZ(0) scale(1.06); }
      50%      { transform: translateZ(0) scale(1.1); }
    }

    /* ── HEADER ── */
    .header {
      position: fixed;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      pointer-events: none;
      width: min(92vw, 720px);
    }
    .header nav {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: rgba(5,5,9,0.45);
      transition: background 0.5s ease;
    }
    .header.scrolled nav { background: rgba(5,5,9,0.82); }
    .logo-seal {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
      color: inherit;
    }
    .logo-seal svg { width: 40px; height: 40px; flex-shrink: 0; }
    .logo-text { line-height: 1.1; }
    .logo-text strong {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      color: var(--champagne);
      font-weight: 400;
    }
    .logo-text span {
      font-size: 0.42rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(201,169,98,0.55);
    }
    .nav-divider { width: 1px; height: 18px; background: rgba(255,255,255,0.12); }
    .nav-link {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(245,240,230,0.55);
      text-decoration: none;
      transition: color 0.3s;
    }
    .nav-link:hover { color: var(--ivory); }
    .nav-cta {
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--champagne);
      border: 1px solid var(--champagne);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      text-decoration: none;
      transition: background 0.3s;
    }
    .nav-cta:hover { background: rgba(201,169,98,0.1); }

    /* ── CURSOR ── */
    .cursor-dot, .cursor-ring {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }
    .cursor-dot {
      width: 8px; height: 8px;
      background: var(--champagne);
      border-radius: 50%;
      mix-blend-mode: difference;
      transition: width 0.2s, height 0.2s;
    }
    .cursor-ring {
      width: 36px; height: 36px;
      border: 1px solid rgba(201,169,98,0.5);
      border-radius: 50%;
      z-index: 9998;
      transition: width 0.3s, height 0.3s, border-color 0.3s;
    }
    body.cursor-hovering .cursor-dot { width: 4px; height: 4px; }
    body.cursor-hovering .cursor-ring { width: 52px; height: 52px; border-color: rgba(201,169,98,0.9); }

    /* ── HERO ── */
    #hero {
      position: relative;
      background: var(--bg);
    }
    .stage {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .hero-vid, .idle-layer, .exp-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      will-change: transform, opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: opacity 0.9s ease;
    }
    .hero-vid {
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }
    #idleVid { z-index: 1; opacity: 1; pointer-events: none; }
    #idleVid.off { opacity: 0; visibility: hidden; }
    #journeyLayer {
      position: absolute; inset: 0; z-index: 3;
      pointer-events: none; overflow: hidden;
      opacity: 0; visibility: hidden;
      background: var(--bg);
    }
    #journeyLayer.on { opacity: 1; visibility: visible; }
    #journeyCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 1;
    }

    .video-loading {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5,5,9,0.85);
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(201,169,98,0.7);
      transition: opacity 0.6s ease;
    }
    .video-loading.done { opacity: 0; pointer-events: none; }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(5,5,9,0.55) 100%);
    }

    .scroll-hint {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .scroll-hint.visible { opacity: 1; }
    .scroll-hint .line {
      width: 1px;
      height: 44px;
      background: linear-gradient(to bottom, transparent, var(--champagne));
      animation: scrollLine 2s ease-in-out infinite;
    }
    .scroll-hint span {
      font-size: 9px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(201,169,98,0.65);
    }

    /* ── GLASS PANELS ── */
    .panels {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 2.4fr minmax(260px, 1fr);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .panels.visible { opacity: 1; }
    .panel-left, .panel-right {
      display: flex;
      align-items: center;
      padding: 80px 20px;
      pointer-events: auto;
    }
    .panel-left { justify-content: flex-start; padding-left: 44px; }
    .panel-right { justify-content: flex-end; padding-right: 44px; }

    .glass {
      position: relative;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 32px rgba(0,0,0,0.35);
      transition: transform 0.35s ease, opacity 0.55s ease;
    }
    .glass:hover { transform: scale(1.01); }
    .glass-inner { padding: 1.75rem; }

    .panel-card {
      max-width: 300px;
      opacity: 0;
      transform: translateX(-14px);
      transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .panel-card.right {
      max-width: 280px;
      transform: translateX(14px);
    }
    .panel-card.show { opacity: 1; transform: none; }
    .panel-card.exit-left { opacity: 0; transform: translateX(-8px); }
    .panel-card.exit-right { opacity: 0; transform: translateX(8px); }

    .chapter-label {
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--champagne);
      margin-bottom: 14px;
    }
    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(24px, 2.5vw, 40px);
      font-weight: 400;
      color: var(--ivory);
      letter-spacing: 0.04em;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    .panel-sub {
      font-size: 13px;
      line-height: 1.75;
      color: rgba(245,240,230,0.62);
      font-weight: 300;
    }
    .detail-label {
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--champagne);
      margin-bottom: 12px;
    }
    .detail-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      margin-bottom: 14px;
    }
    .detail-notes { list-style: none; margin-bottom: 18px; }
    .detail-notes li {
      font-size: 12px;
      color: rgba(245,240,230,0.6);
      margin-bottom: 6px;
      padding-left: 14px;
      position: relative;
    }
    .detail-notes li::before {
      content: '◆';
      position: absolute;
      left: 0;
      color: var(--champagne);
      font-size: 8px;
      top: 3px;
    }
    .detail-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: var(--champagne);
      margin-bottom: 16px;
    }
    .btn-outline {
      display: block;
      width: 100%;
      text-align: center;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--champagne);
      background: transparent;
      color: var(--champagne);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: none;
      transition: background 0.3s;
    }
    .btn-outline:hover { background: rgba(201,169,98,0.1); }
    .btn-link {
      display: block;
      margin-top: 10px;
      font-size: 11px;
      color: rgba(245,240,230,0.5);
      text-decoration: underline;
      text-align: center;
      cursor: none;
    }
    .btn-link:hover { color: var(--ivory); }

    /* ── CHAPTER DOTS ── */
    .chapter-dots {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .chapter-dots.visible { opacity: 1; }
    .chapter-dots span {
      height: 6px;
      border-radius: 3px;
      background: rgba(245,240,230,0.22);
      transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .chapter-dots span.lit {
      width: 24px;
      background: var(--champagne);
    }
    .chapter-dots span:not(.lit) { width: 6px; }

    /* ── FOOTER ── */
    .footer {
      background: var(--bg);
      padding: 5rem 2rem 3rem;
      text-align: center;
    }
    .footer h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--champagne);
      margin: 1rem 0 0.4rem;
    }
    .footer p { font-size: 0.65rem; color: var(--grey); }
    .footer a {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: rgba(245,240,230,0.5);
      text-decoration: none;
    }
    .footer a:hover { color: var(--champagne); }
    .footer-rule {
      max-width: 1100px;
      margin: 2rem auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,169,98,0.2), transparent);
    }

    @media (max-width: 900px) {
      .panels { grid-template-columns: 1fr; }
      .panel-right { display: none; }
      .panel-left { padding: 60px 24px; justify-content: center; }
      .nav-link.hide-mobile { display: none; }
    }
  </style>
</head>
<body>
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <header class="header" id="header">
    <nav>
      <a class="logo-seal" href="shores.html" data-cursor-hover>
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" fill="none" stroke="#c9a962" stroke-width="0.7" stroke-opacity="0.65"/>
          <polygon points="20,2 21.4,4.2 20,6.4 18.6,4.2" fill="#c9a962" fill-opacity="0.65"/>
          <polygon points="20,33.6 21.4,35.8 20,38 18.6,35.8" fill="#c9a962" fill-opacity="0.65"/>
          <line x1="1.5" y1="20" x2="4" y2="20" stroke="#c9a962" stroke-width="0.7" stroke-opacity="0.4"/>
          <line x1="36" y1="20" x2="38.5" y2="20" stroke="#c9a962" stroke-width="0.7" stroke-opacity="0.4"/>
          <text x="20" y="24" text-anchor="middle" fill="#c9a962" font-family="Cormorant Garamond, serif" font-size="13">AE</text>
        </svg>
        <div class="logo-text">
          <strong>Aether</strong>
          <span>Collection</span>
        </div>
      </a>
      <div class="nav-divider"></div>
      <a class="nav-link hide-mobile" href="#hero" data-cursor-hover>Experience</a>
      <a class="nav-link hide-mobile" href="#footer" data-cursor-hover>Rooms</a>
      <div class="nav-divider hide-mobile"></div>
      <a class="nav-cta" href="#footer" data-cursor-hover>Reserve</a>
    </nav>
  </header>

  <section id="hero">
    <div class="stage" id="stage">
      <div id="journeyLayer">
        <canvas id="journeyCanvas"></canvas>
      </div>
      <div id="videoStatus" class="video-loading">Loading journey…</div>

      <div class="vignette"></div>

      <div class="scroll-hint" id="scrollHint">
        <div class="line"></div>
        <span>Scroll</span>
      </div>

      <div class="panels" id="panels">
        <div class="panel-left">
          <div class="glass panel-card" id="framePanel">
            <div class="glass-inner">
              <p class="chapter-label" id="frameChapter"></p>
              <h2 class="panel-title" id="frameTitle"></h2>
              <p class="panel-sub" id="frameSub"></p>
            </div>
          </div>
        </div>
        <div></div>
        <div class="panel-right">
          <div class="glass panel-card right" id="detailPanel">
            <div class="glass-inner" id="detailInner"></div>
          </div>
        </div>
      </div>

      <div class="chapter-dots" id="chapterDots"></div>
    </div>
  </section>

  <footer class="footer" id="footer">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18.5" fill="none" stroke="#c9a962" stroke-width="0.7" stroke-opacity="0.65"/>
      <text x="20" y="24" text-anchor="middle" fill="#c9a962" font-family="Cormorant Garamond, serif" font-size="13">AE</text>
    </svg>
    <h3>Aether Hotel</h3>
    <p>Where silence learns to glow</p>
    <div class="footer-rule"></div>
    <p style="opacity:0.45;font-size:0.75rem">Video &amp; imagery by Grok Imagine · scroll architecture inspired by Cartier-class experiences</p>
    <a href="shores.html" data-cursor-hover>← return to shores</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script>
(async function () {
  'use strict';
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
    document.body.innerHTML = '<p style="color:#c9a962;padding:2rem">GSAP failed to load. Check internet connection.</p>';
    return;
  }
  gsap.registerPlugin(ScrollTrigger);

  const PX_PER_SECOND = 270;
  const IDLE_THRESHOLD = 0.012;
  const TRANSITION_SCROLL_SHARE = 0.125;
  const TIME_SMOOTH = 16;
  const NO_PANEL_FRAMES = new Set(['entry', 'complete']);
  const CACHE = '?v=27';
  const LOAD_CAP_MS = 5000;
  const ASSET = 'assets/hotel/';
  let JOURNEY_T0 = 8.04;
  let IDLE_T = 8.04;

  const FRAMES = {
    entry:    { chapter: 'The Threshold', title: 'Beyond the façade', subtitle: 'Scroll slowly. Each frame unveils the next room — a dance between scenes, not a leap.', detail: null },
    lobby:    { chapter: '01 — Arrival', title: 'The lobby breathes gold', subtitle: 'Marble columns rise like quiet monuments. Chandeliers hold the night in amber glass.', detail: { notes: ['Marble atrium', 'Champagne reception', 'Private concierge'], price: 'From €840', cta: 'Reserve Arrival Suite' } },
    corridor: { chapter: '02 — Passage', title: 'Corridors that remember', subtitle: 'Each step deepens the hush. Sconces paint the walls in slow fire.', detail: { notes: ['Velvet silence', 'Brass sconce light', 'Scent of cedar'], price: 'From €620', cta: 'Explore Passage' } },
    suite:    { chapter: '03 — Residence', title: 'Your suite above the city', subtitle: 'Silk, glass, and the whole skyline laid at your feet.', detail: { notes: ['Panoramic glass', 'Silk linens', 'Midnight skyline'], price: 'From €1,200', cta: 'Book Penthouse' } },
    spa:      { chapter: '04 — Submersion', title: 'The spa at the edge of sleep', subtitle: 'Steam, stone, candlelight on black water. Time dissolves here.', detail: { notes: ['Thermal stone', 'Black water pool', 'Candlelit steam'], price: 'From €480', cta: 'Reserve Ritual' } },
    complete: { chapter: 'The Return', title: 'You crossed the veil.', subtitle: 'The circle is complete. Scroll again to walk the path once more.', detail: null },
  };

  let SEGMENTS = [];
  let PACE_ZONES = [];
  let GLOW_FROM = 36.75;
  let GLOW_TO = 38.32;
  let FRAME_LIST = [];
  let FRAME_FPS = 8;
  let TOTAL_DURATION = 46.38;
  let TOTAL_SCROLL_PX = TOTAL_DURATION * PX_PER_SECOND;
  let isIdle = true;
  let panelFrameId = null;
  let paintToken = 0;
  let targetT = 8.04;
  let displayT = 8.04;
  let lastTickMs = 0;
  const imgCache = new Map();

  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }

  function smootherstep(x) {
    x = clamp(x, 0, 1);
    return x * x * x * (x * (x * 6 - 15) + 10);
  }

  const hero = document.getElementById('hero');
  const stage = document.getElementById('stage');
  const journeyLayer = document.getElementById('journeyLayer');
  const journeyCanvas = document.getElementById('journeyCanvas');
  let canvasCtx = null;
  const videoStatus = document.getElementById('videoStatus');
  const scrollHint = document.getElementById('scrollHint');
  const panels = document.getElementById('panels');
  const framePanel = document.getElementById('framePanel');
  const detailPanel = document.getElementById('detailPanel');
  const chapterDots = document.getElementById('chapterDots');
  const header = document.getElementById('header');

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function waitForVideo(el, timeoutMs) {
    return new Promise(resolve => {
      if (!el) return resolve(false);
      const done = ok => { clearTimeout(timer); resolve(ok); };
      const timer = setTimeout(() => done(el.readyState >= 2), timeoutMs);
      if (el.readyState >= 2) return done(true);
      const check = () => { if (el.readyState >= 2) done(true); };
      el.addEventListener('loadeddata', check, { once: true });
      el.addEventListener('canplay', check, { once: true });
      el.addEventListener('error', () => done(false), { once: true });
    });
  }

  function setStatus(msg, err) {
    if (!videoStatus) return;
    videoStatus.textContent = msg;
    if (err) videoStatus.style.color = '#e8a0a0';
  }

  function hideLoading() {
    videoStatus?.classList.add('done');
  }

  function buildPaceZones(timeline, t0, tEnd) {
    if (!timeline?.length) return [];
    const journey = timeline.filter(c =>
      c.end > t0 + 0.01 && c.start < tEnd - 0.01 && !c.skipInJourney);
    const transitions = journey.filter(c => c.kind === 'transition');
    const scenes = journey.filter(c => c.kind === 'scene');
    const transBudget = transitions.length * TRANSITION_SCROLL_SHARE;
    const sceneDur = scenes.reduce((sum, c) => {
      const start = Math.max(c.start, t0);
      const end = Math.min(c.end, tEnd);
      return sum + Math.max(0, end - start);
    }, 0);
    const sceneBudget = Math.max(0.001, 1 - transBudget);
    return journey.map(c => {
      const clipStart = c.playStart ?? c.start;
      const clipEnd = c.playEnd ?? c.end;
      const start = Math.max(clipStart, t0);
      const end = Math.min(clipEnd, tEnd);
      const fullDur = Math.max(0.001, Math.min(c.end, tEnd) - Math.max(c.start, t0));
      const share = c.kind === 'transition'
        ? TRANSITION_SCROLL_SHARE
        : sceneBudget * (fullDur / sceneDur);
      return { start, end, share, kind: c.kind, file: c.file };
    });
  }

  function timeAtProgress(p) {
    if (p < IDLE_THRESHOLD) return JOURNEY_T0;
    const u = (p - IDLE_THRESHOLD) / (1 - IDLE_THRESHOLD);
    if (!PACE_ZONES.length) {
      return JOURNEY_T0 + u * (TOTAL_DURATION - JOURNEY_T0);
    }
    let acc = 0;
    for (const z of PACE_ZONES) {
      if (u <= acc + z.share + 1e-9) {
        const raw = Math.min(1, Math.max(0, (u - acc) / z.share));
        const local = z.kind === 'transition' ? smootherstep(raw) : raw;
        return z.start + local * (z.end - z.start);
      }
      acc += z.share;
    }
    return PACE_ZONES[PACE_ZONES.length - 1].end;
  }

  function resizeCanvas() {
    const w = stage.clientWidth || window.innerWidth;
    const h = stage.clientHeight || window.innerHeight;
    if (journeyCanvas.width !== w || journeyCanvas.height !== h) {
      journeyCanvas.width = w;
      journeyCanvas.height = h;
      if (canvasCtx && journeyLayer.classList.contains('on')) paintJourney(displayT);
    }
  }

  function loadFrame(url) {
    let img = imgCache.get(url);
    if (!img) {
      img = new Image();
      img.decoding = 'sync';
      imgCache.set(url, img);
      img.src = url;
    } else if (img.src !== url) {
      img.src = url;
    }
    return new Promise(resolve => {
      if (img.complete && img.naturalWidth) return resolve(img);
      const done = () => resolve(img);
      img.onload = done;
      img.onerror = done;
      if (img.decode) img.decode().then(done).catch(done);
      else setTimeout(done, 80);
    });
  }

  function drawCover(img, alpha, zoom) {
    if (!canvasCtx || !img?.naturalWidth) return;
    const cw = journeyCanvas.width;
    const ch = journeyCanvas.height;
    const vw = img.naturalWidth;
    const vh = img.naturalHeight;
    const z = zoom || 1;
    const scale = Math.max(cw / vw, ch / vh) * z;
    const dw = vw * scale;
    const dh = vh * scale;
    const dx = (cw - dw) * 0.5;
    const dy = (ch - dh) * 0.5;
    canvasCtx.globalAlpha = alpha;
    canvasCtx.drawImage(img, dx, dy, dw, dh);
  }

  function frameIndexAt(t) {
    let i = 0;
    for (let j = FRAME_LIST.length - 1; j >= 0; j--) {
      if (t >= FRAME_LIST[j].t) { i = j; break; }
    }
    return i;
  }

  function prefetchAround(i) {
    for (let k = 1; k <= 20; k++) {
      const f = FRAME_LIST[i + k];
      if (!f) break;
      loadFrame(`${ASSET}${f.file}${CACHE}`);
    }
    for (let k = 1; k <= 6; k++) {
      const f = FRAME_LIST[i - k];
      if (!f) break;
      loadFrame(`${ASSET}${f.file}${CACHE}`);
    }
  }

  function journeyZoom(t) {
    return 1.038 + t * 0.00042;
  }

  function blitFrames(img0, img1, frac, t) {
    if (!canvasCtx) return;
    const has0 = img0?.naturalWidth;
    const has1 = img1?.naturalWidth;
    if (!has0 && !has1) return;

    const blend = clamp(frac, 0, 1);
    const zoom = journeyZoom(t);

    // Never clear to black — opaque base + alpha overlay avoids mid-blend dark flashes.
    if (has0) {
      canvasCtx.globalAlpha = 1;
      drawCover(img0, 1, zoom);
    }
    if (has1 && blend > 0.002 && img1 !== img0) {
      canvasCtx.globalAlpha = blend;
      drawCover(img1, 1, zoom);
    }
    canvasCtx.globalAlpha = 1;
  }

  function frameBlendAt(t) {
    const i = frameIndexAt(t);
    const f0 = FRAME_LIST[i];
    const f1 = FRAME_LIST[Math.min(i + 1, FRAME_LIST.length - 1)];
    const span = Math.max(f1.t - f0.t, 0.001);
    return {
      i,
      f0,
      f1,
      frac: clamp((t - f0.t) / span, 0, 1),
      s0: `${ASSET}${f0.file}${CACHE}`,
      s1: `${ASSET}${f1.file}${CACHE}`,
    };
  }

  function paintJourney(t) {
    if (!FRAME_LIST.length || !canvasCtx) return;
    const { i, s0, s1 } = frameBlendAt(t);
    const img0 = imgCache.get(s0);
    const img1 = imgCache.get(s1);

    prefetchAround(i);

    const draw = (a, b, at) => {
      const blend = frameBlendAt(at);
      if (b?.naturalWidth) blitFrames(a, b, blend.frac, at);
      else blitFrames(a, a, 0, at);
    };

    const ready0 = img0?.complete && img0.naturalWidth;
    const ready1 = img1?.complete && img1.naturalWidth;

    if (ready0) {
      draw(img0, ready1 ? img1 : null, t);
      return;
    }

    // Missing frame: keep last canvas pixels; load without blanking.
    const token = ++paintToken;
    Promise.all([loadFrame(s0), loadFrame(s1)]).then(([a, b]) => {
      if (token !== paintToken) return;
      if (a?.naturalWidth || b?.naturalWidth) draw(a, b, displayT);
    });
  }

  function syncPanels(t, animate) {
    if (t >= GLOW_FROM && t < GLOW_TO) {
      if (panelFrameId !== 'glow') {
        panels.classList.remove('visible');
        panelFrameId = 'glow';
      }
      return;
    }
    const frameId = segmentAt(t).frameId || 'entry';
    if (frameId !== panelFrameId) {
      updatePanels(frameId, animate && panelFrameId !== null && panelFrameId !== 'glow');
    }
  }

  function goIdle() {
    isIdle = true;
    paintToken++;
    targetT = IDLE_T;
    displayT = IDLE_T;
    lastTickMs = 0;
    journeyLayer.classList.add('on');
    resizeCanvas();
    paintJourney(IDLE_T);
    scrollHint.classList.add('visible');
    chapterDots.classList.remove('visible');
    panels.classList.remove('visible');
    panelFrameId = null;
  }

  function goScrub(t) {
    isIdle = false;
    targetT = t;

    if (!journeyLayer.classList.contains('on')) {
      journeyLayer.classList.add('on');
      resizeCanvas();
    }
    scrollHint.classList.remove('visible');
    chapterDots.classList.add('visible');
  }

  function tickJourney(time) {
    if (!journeyLayer.classList.contains('on')) return;
    const now = typeof time === 'number' ? time * 1000 : performance.now();
    const dt = lastTickMs ? Math.min(0.05, (now - lastTickMs) / 1000) : 1 / 60;
    lastTickMs = now;

    const diff = targetT - displayT;
    if (Math.abs(diff) < 0.00025) {
      displayT = targetT;
    } else {
      const catchUp = Math.min(0.35, Math.abs(diff) * 0.14);
      const k = 1 - Math.exp(-(TIME_SMOOTH + catchUp) * dt);
      displayT += diff * k;
    }

    paintJourney(displayT);
    if (!isIdle) syncPanels(displayT, true);
  }

  try {
    const [meta, manifest] = await Promise.all([
      fetch(`${ASSET}video_meta.json${CACHE}`).then(r => r.ok ? r.json() : null),
      fetch(`${ASSET}frames_manifest.json${CACHE}`).then(r => r.ok ? r.json() : null),
    ]);
    if (meta?.segments_hint?.length) SEGMENTS = meta.segments_hint;
    if (meta?.journeyStart) {
      JOURNEY_T0 = meta.journeyStart;
      IDLE_T = meta.journeyStart;
      targetT = meta.journeyStart;
      displayT = meta.journeyStart;
    }
    if (meta?.experience) TOTAL_DURATION = meta.experience;
    if (meta?.timeline) {
      PACE_ZONES = buildPaceZones(meta.timeline, JOURNEY_T0, TOTAL_DURATION);
      const glow = meta.timeline.find(c => c.file === 'trans_suite_spa.mp4');
      if (glow?.playStart != null) GLOW_FROM = glow.playStart;
      if (glow?.playEnd != null) GLOW_TO = glow.playEnd;
    }
    if (manifest?.frames?.length) {
      FRAME_LIST = manifest.frames;
      FRAME_FPS = manifest.fps || 8;
    }
  } catch (_) {}

  if (!FRAME_LIST.length) {
    setStatus('Missing frames — run scripts/extract_hotel_frames.py', true);
    return;
  }

  TOTAL_SCROLL_PX = (TOTAL_DURATION - JOURNEY_T0) * PX_PER_SECOND;
  setStatus('Loading…');

  const journeyStart = FRAME_LIST.findIndex(f => f.t >= JOURNEY_T0 - 0.01);
  const bootFrames = FRAME_LIST.slice(Math.max(0, journeyStart), journeyStart + 96).map(f => f.file);
  canvasCtx = journeyCanvas.getContext('2d', { alpha: false });
  canvasCtx.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in canvasCtx) canvasCtx.imageSmoothingQuality = 'high';
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const boot = Promise.all(bootFrames.map(f => loadFrame(`${ASSET}${f}${CACHE}`)));
  await Promise.race([boot, new Promise(r => setTimeout(r, LOAD_CAP_MS))]);
  hideLoading();

  SEGMENTS.filter(s => s.id !== 'entry' && s.id !== 'outro').forEach(s => {
    const dot = document.createElement('span');
    dot.dataset.frame = s.frameId;
    chapterDots.appendChild(dot);
  });

  function segmentAt(t) {
    for (let i = SEGMENTS.length - 1; i >= 0; i--) {
      if (t >= SEGMENTS[i].transitionStart) return SEGMENTS[i];
    }
    return SEGMENTS[0] || { frameId: 'entry' };
  }

  function renderDetail(frame) {
    const inner = document.getElementById('detailInner');
    if (!frame.detail) { detailPanel.style.display = 'none'; return; }
    detailPanel.style.display = '';
    inner.innerHTML = `
      <p class="detail-label">Experience</p>
      <h3 class="detail-title">${frame.title}</h3>
      <ul class="detail-notes">${frame.detail.notes.map(n => `<li>${n}</li>`).join('')}</ul>
      <p class="detail-price">${frame.detail.price}</p>
      <button class="btn-outline" data-cursor-hover>${frame.detail.cta}</button>
      <a class="btn-link" href="#footer" data-cursor-hover>Discover more</a>`;
    attachCursorHover();
  }

  function updatePanels(frameId, animate) {
    if (NO_PANEL_FRAMES.has(frameId)) {
      panels.classList.remove('visible');
      panelFrameId = frameId;
      return;
    }
    panels.classList.add('visible');
    if (frameId === panelFrameId) return;
    const frame = FRAMES[frameId];
    if (!frame) return;

    const swap = () => {
      document.getElementById('frameChapter').textContent = frame.chapter || '';
      document.getElementById('frameTitle').textContent = frame.title;
      document.getElementById('frameSub').textContent = frame.subtitle;
      renderDetail(frame);
      framePanel.className = 'glass panel-card show';
      detailPanel.className = 'glass panel-card right show';
      panelFrameId = frameId;
    };

    if (animate && panelFrameId && !NO_PANEL_FRAMES.has(panelFrameId)) {
      framePanel.className = 'glass panel-card exit-left';
      detailPanel.className = 'glass panel-card right exit-right';
      setTimeout(swap, 200);
    } else {
      swap();
    }

    chapterDots.querySelectorAll('span').forEach(d => {
      d.classList.toggle('lit', d.dataset.frame === frameId);
    });
  }

  /* ── CURSOR ── */
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0, cursorReady = false;

  function attachCursorHover() {
    document.querySelectorAll('a, button, [data-cursor-hover]').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hovering'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hovering'));
    });
  }
  document.addEventListener('mousemove', e => {
    mouseX = e.clientX; mouseY = e.clientY;
    dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px';
    if (!cursorReady) { dot.style.opacity = ring.style.opacity = '1'; cursorReady = true; }
  });
  (function cursorTick() {
    ringX += (mouseX - ringX) * 0.12;
    ringY += (mouseY - ringY) * 0.12;
    ring.style.left = ringX + 'px'; ring.style.top = ringY + 'px';
    requestAnimationFrame(cursorTick);
  })();
  attachCursorHover();
  new MutationObserver(attachCursorHover).observe(document.body, { childList: true, subtree: true });

  hero.style.minHeight = `calc(100vh + ${TOTAL_SCROLL_PX}px)`;

  const lenis = typeof Lenis !== 'undefined'
    ? new Lenis({ duration: 1.2, smoothWheel: true, lerp: 0.12, wheelMultiplier: 0.95, touchMultiplier: 1.05 })
    : null;
  if (lenis) {
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(t => lenis.raf(t * 1000));
    gsap.ticker.lagSmoothing(0);
  }
  gsap.ticker.add(tickJourney);

  ScrollTrigger.create({
    trigger: hero,
    start: 'top top',
    end: `+=${TOTAL_SCROLL_PX}`,
    pin: stage,
    pinSpacing: true,
    anticipatePin: 1,
    scrub: 0.45,
    onUpdate(self) {
      const p = self.progress;

      if (p < IDLE_THRESHOLD) {
        if (!isIdle) goIdle();
        return;
      }

      goScrub(timeAtProgress(p));
    },
  });

  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 60);
  }, { passive: true });

  goIdle();
  ScrollTrigger.refresh();
})();
  </script>
</body>
</html>
