<!DOCTYPE html>
<html lang="en" class="lenis">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AETHER — The Hotel Beyond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050509;
      --champagne: #c9a962;
      --ivory: #f5f0e6;
      --grey: #9e9eae;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: auto !important; }
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-stopped { overflow: hidden; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ivory);
      overflow-x: hidden;
      cursor: none;
    }
    ::selection { background: rgba(201, 169, 98, 0.22); color: var(--ivory); }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(201, 169, 98, 0.3); border-radius: 2px; }

    @keyframes scrollLine {
      0%   { transform: scaleY(0); transform-origin: top; }
      50%  { transform: scaleY(1); transform-origin: top; }
      51%  { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }
    @keyframes idleBreath {
      0%, 100% { transform: translateZ(0) scale(1.06); }
      50%      { transform: translateZ(0) scale(1.1); }
    }

    /* ── HEADER ── */
    .header {
      position: fixed;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      pointer-events: none;
      width: min(92vw, 720px);
    }
    .header nav {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: rgba(5,5,9,0.45);
      transition: background 0.5s ease;
    }
    .header.scrolled nav { background: rgba(5,5,9,0.82); }
    .logo-seal {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
      color: inherit;
    }
    .logo-seal svg { width: 40px; height: 40px; flex-shrink: 0; }
    .logo-text { line-height: 1.1; }
    .logo-text strong {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      color: var(--champagne);
      font-weight: 400;
    }
    .logo-text span {
      font-size: 0.42rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(201,169,98,0.55);
    }
    .nav-divider { width: 1px; height: 18px; background: rgba(255,255,255,0.12); }
    .nav-link {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(245,240,230,0.55);
      text-decoration: none;
      transition: color 0.3s;
    }
    .nav-link:hover { color: var(--ivory); }
    .nav-cta {
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--champagne);
      border: 1px solid var(--champagne);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      text-decoration: none;
      transition: background 0.3s;
    }
    .nav-cta:hover { background: rgba(201,169,98,0.1); }

    /* ── CURSOR ── */
    .cursor-dot, .cursor-ring {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }
    .cursor-dot {
      width: 8px; height: 8px;
      background: var(--champagne);
      border-radius: 50%;
      mix-blend-mode: difference;
      transition: width 0.2s, height 0.2s;
    }
    .cursor-ring {
      width: 36px; height: 36px;
      border: 1px solid rgba(201,169,98,0.5);
      border-radius: 50%;
      z-index: 9998;
      transition: width 0.3s, height 0.3s, border-color 0.3s;
    }
    body.cursor-hovering .cursor-dot { width: 4px; height: 4px; }
    body.cursor-hovering .cursor-ring { width: 52px; height: 52px; border-color: rgba(201,169,98,0.9); }

    /* ── HERO ── */
    #hero {
      position: relative;
      background: var(--bg);
    }
    .stage {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .hero-vid, .idle-layer, .exp-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      will-change: transform, opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: opacity 0.9s ease;
    }
    .hero-vid {
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }
    #idleVid { z-index: 1; opacity: 1; }
    #idleVid.off { opacity: 0; }
    #expVid { z-index: 2; opacity: 0; }
    #expVid.on { opacity: 1; }

    .idle-layer { z-index: 1; opacity: 1; }
    .idle-layer.off { opacity: 0; }
    .exp-layer { z-index: 2; opacity: 0; }
    .exp-layer.on { opacity: 1; }

    .idle-bg {
      position: absolute;
      inset: -8%;
      background: center/cover no-repeat url('assets/hotel/exterior.jpg');
      filter: brightness(0.68) saturate(0.92);
      animation: idleBreath 14s ease-in-out infinite;
    }

    .scene-layer {
      position: absolute;
      inset: -10%;
      opacity: 0;
      will-change: opacity, transform, filter;
      pointer-events: none;
    }
    .scene-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      will-change: transform, filter;
    }

    .dance-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 1;
    }
    .dance-scene {
      position: absolute;
      inset: -10%;
      opacity: 0;
      will-change: opacity, transform, filter;
    }
    .dance-scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    .transition-veil {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(201,169,98,0.35) 0%, rgba(120,80,200,0.12) 40%, transparent 72%);
      mix-blend-mode: screen;
      will-change: opacity;
    }
    .transition-mist {
      position: absolute;
      inset: -5%;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(115deg, transparent 20%, rgba(201,169,98,0.08) 45%, rgba(8,6,10,0.25) 55%, transparent 80%);
      will-change: opacity, transform;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(5,5,9,0.55) 100%);
    }

    .scroll-hint {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .scroll-hint.visible { opacity: 1; }
    .scroll-hint .line {
      width: 1px;
      height: 44px;
      background: linear-gradient(to bottom, transparent, var(--champagne));
      animation: scrollLine 2s ease-in-out infinite;
    }
    .scroll-hint span {
      font-size: 9px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(201,169,98,0.65);
    }

    /* ── GLASS PANELS ── */
    .panels {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 2.4fr minmax(260px, 1fr);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .panels.visible { opacity: 1; }
    .panel-left, .panel-right {
      display: flex;
      align-items: center;
      padding: 80px 20px;
      pointer-events: auto;
    }
    .panel-left { justify-content: flex-start; padding-left: 44px; }
    .panel-right { justify-content: flex-end; padding-right: 44px; }

    .glass {
      position: relative;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 32px rgba(0,0,0,0.35);
      transition: transform 0.35s ease, opacity 0.55s ease;
    }
    .glass:hover { transform: scale(1.01); }
    .glass-inner { padding: 1.75rem; }

    .panel-card {
      max-width: 300px;
      opacity: 0;
      transform: translateX(-20px);
      transition: opacity 0.55s cubic-bezier(0.25,0.46,0.45,0.94), transform 0.55s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .panel-card.right {
      max-width: 280px;
      transform: translateX(20px);
    }
    .panel-card.show { opacity: 1; transform: none; }
    .panel-card.exit-left { opacity: 0; transform: translateX(-12px); }
    .panel-card.exit-right { opacity: 0; transform: translateX(12px); }

    .chapter-label {
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--champagne);
      margin-bottom: 14px;
    }
    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(24px, 2.5vw, 40px);
      font-weight: 400;
      color: var(--ivory);
      letter-spacing: 0.04em;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    .panel-sub {
      font-size: 13px;
      line-height: 1.75;
      color: rgba(245,240,230,0.62);
      font-weight: 300;
    }
    .detail-label {
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--champagne);
      margin-bottom: 12px;
    }
    .detail-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      margin-bottom: 14px;
    }
    .detail-notes { list-style: none; margin-bottom: 18px; }
    .detail-notes li {
      font-size: 12px;
      color: rgba(245,240,230,0.6);
      margin-bottom: 6px;
      padding-left: 14px;
      position: relative;
    }
    .detail-notes li::before {
      content: '◆';
      position: absolute;
      left: 0;
      color: var(--champagne);
      font-size: 8px;
      top: 3px;
    }
    .detail-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: var(--champagne);
      margin-bottom: 16px;
    }
    .btn-outline {
      display: block;
      width: 100%;
      text-align: center;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--champagne);
      background: transparent;
      color: var(--champagne);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: none;
      transition: background 0.3s;
    }
    .btn-outline:hover { background: rgba(201,169,98,0.1); }
    .btn-link {
      display: block;
      margin-top: 10px;
      font-size: 11px;
      color: rgba(245,240,230,0.5);
      text-decoration: underline;
      text-align: center;
      cursor: none;
    }
    .btn-link:hover { color: var(--ivory); }

    /* ── CHAPTER DOTS ── */
    .chapter-dots {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .chapter-dots.visible { opacity: 1; }
    .chapter-dots span {
      height: 6px;
      border-radius: 3px;
      background: rgba(245,240,230,0.22);
      transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .chapter-dots span.lit {
      width: 24px;
      background: var(--champagne);
    }
    .chapter-dots span:not(.lit) { width: 6px; }

    /* ── FOOTER ── */
    .footer {
      background: var(--bg);
      padding: 5rem 2rem 3rem;
      text-align: center;
    }
    .footer h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--champagne);
      margin: 1rem 0 0.4rem;
    }
    .footer p { font-size: 0.65rem; color: var(--grey); }
    .footer a {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: rgba(245,240,230,0.5);
      text-decoration: none;
    }
    .footer a:hover { color: var(--champagne); }
    .footer-rule {
      max-width: 1100px;
      margin: 2rem auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,169,98,0.2), transparent);
    }

    @media (max-width: 900px) {
      .panels { grid-template-columns: 1fr; }
      .panel-right { display: none; }
      .panel-left { padding: 60px 24px; justify-content: center; }
      .nav-link.hide-mobile { display: none; }
    }
  </style>
</head>
<body>
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <header class="header" id="header">
    <nav>
      <a class="logo-seal" href="shores.html" data-cursor-hover>
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" fill="none" stroke="#c9a962" stroke-width="0.7" stroke-opacity="0.65"/>
          <polygon points="20,2 21.4,4.2 20,6.4 18.6,4.2" fill="#c9a962" fill-opacity="0.65"/>
          <polygon points="20,33.6 21.4,35.8 20,38 18.6,35.8" fill="#c9a962" fill-opacity="0.65"/>
          <line x1="1.5" y1="20" x2="4" y2="20" stroke="#c9a962" stroke-width="0.7" stroke-opacity="0.4"/>
          <line x1="36" y1="20" x2="38.5" y2="20" stroke="#c9a962" stroke-width="0.7" stroke-opacity="0.4"/>
          <text x="20" y="24" text-anchor="middle" fill="#c9a962" font-family="Cormorant Garamond, serif" font-size="13">AE</text>
        </svg>
        <div class="logo-text">
          <strong>Aether</strong>
          <span>Collection</span>
        </div>
      </a>
      <div class="nav-divider"></div>
      <a class="nav-link hide-mobile" href="#hero" data-cursor-hover>Experience</a>
      <a class="nav-link hide-mobile" href="#footer" data-cursor-hover>Rooms</a>
      <div class="nav-divider hide-mobile"></div>
      <a class="nav-cta" href="#footer" data-cursor-hover>Reserve</a>
    </nav>
  </header>

  <section id="hero">
    <div class="stage" id="stage">
      <video id="idleVid" class="hero-vid" autoplay loop muted playsinline preload="auto" crossorigin="anonymous">
        <source src="assets/hotel/intro_loop.mp4" type="video/mp4">
      </video>
      <video id="expVid" class="hero-vid" muted playsinline preload="auto" crossorigin="anonymous">
        <source src="assets/hotel/experience_v2.mp4" type="video/mp4">
      </video>

      <div class="dance-layer" id="danceLayer">
        <div class="dance-scene" data-scene="exterior"><img src="assets/hotel/exterior.jpg" alt=""></div>
        <div class="dance-scene" data-scene="lobby"><img src="assets/hotel/lobby.jpg" alt=""></div>
        <div class="dance-scene" data-scene="corridor"><img src="assets/hotel/corridor.jpg" alt=""></div>
        <div class="dance-scene" data-scene="suite"><img src="assets/hotel/suite.jpg" alt=""></div>
        <div class="dance-scene" data-scene="spa"><img src="assets/hotel/spa.jpg" alt=""></div>
      </div>
      <div class="transition-veil" id="transitionVeil"></div>
      <div class="transition-mist" id="transitionMist"></div>

      <div class="idle-layer" id="idleFallback" hidden>
        <div class="idle-bg"></div>
      </div>
      <div class="exp-layer" id="expFallback" hidden>
        <div class="scene-layer" data-scene="exterior"><img src="assets/hotel/exterior.jpg" alt=""></div>
        <div class="scene-layer" data-scene="lobby"><img src="assets/hotel/lobby.jpg" alt=""></div>
        <div class="scene-layer" data-scene="corridor"><img src="assets/hotel/corridor.jpg" alt=""></div>
        <div class="scene-layer" data-scene="suite"><img src="assets/hotel/suite.jpg" alt=""></div>
        <div class="scene-layer" data-scene="spa"><img src="assets/hotel/spa.jpg" alt=""></div>
      </div>

      <div class="vignette"></div>

      <div class="scroll-hint" id="scrollHint">
        <div class="line"></div>
        <span>Scroll</span>
      </div>

      <div class="panels" id="panels">
        <div class="panel-left">
          <div class="glass panel-card" id="framePanel">
            <div class="glass-inner">
              <p class="chapter-label" id="frameChapter"></p>
              <h2 class="panel-title" id="frameTitle"></h2>
              <p class="panel-sub" id="frameSub"></p>
            </div>
          </div>
        </div>
        <div></div>
        <div class="panel-right">
          <div class="glass panel-card right" id="detailPanel">
            <div class="glass-inner" id="detailInner"></div>
          </div>
        </div>
      </div>

      <div class="chapter-dots" id="chapterDots"></div>
    </div>
  </section>

  <footer class="footer" id="footer">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18.5" fill="none" stroke="#c9a962" stroke-width="0.7" stroke-opacity="0.65"/>
      <text x="20" y="24" text-anchor="middle" fill="#c9a962" font-family="Cormorant Garamond, serif" font-size="13">AE</text>
    </svg>
    <h3>Aether Hotel</h3>
    <p>Where silence learns to glow</p>
    <div class="footer-rule"></div>
    <p style="opacity:0.45;font-size:0.75rem">Video &amp; imagery by Grok Imagine · scroll architecture inspired by Cartier-class experiences</p>
    <a href="shores.html" data-cursor-hover>← return to shores</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollToPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script>
(async function () {
  gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);

  const LERP_FACTOR = 0.08;
  const SEEK_INTERVAL_MS = 1000 / 24;
  const PX_PER_SECOND = 200;
  const NO_PANEL_FRAMES = new Set(['entry', 'complete']);

  const DEFAULT_SEGMENTS = [
    { id: 'entry',    frameId: 'entry',    scene: 'exterior', transitionStart: 0,  transitionEnd: 3,  loopStart: 1.5, loopEnd: 3,  scrollResume: 3  },
    { id: 'lobby',    frameId: 'lobby',    scene: 'lobby',    transitionStart: 3,  transitionEnd: 7,  loopStart: 6,   loopEnd: 9,  scrollResume: 9  },
    { id: 'corridor', frameId: 'corridor', scene: 'corridor', transitionStart: 9,  transitionEnd: 13, loopStart: 12,  loopEnd: 15, scrollResume: 15 },
    { id: 'suite',    frameId: 'suite',    scene: 'suite',    transitionStart: 15, transitionEnd: 20, loopStart: 19,  loopEnd: 23, scrollResume: 23 },
    { id: 'spa',      frameId: 'spa',      scene: 'spa',      transitionStart: 23, transitionEnd: 28, loopStart: 27,  loopEnd: 31, scrollResume: 31 },
    { id: 'outro',    frameId: 'complete', scene: 'spa',      transitionStart: 31, transitionEnd: 40, loopStart: 35,  loopEnd: 40, scrollResume: 40 },
  ];

  let TOTAL_VIDEO_DURATION = 40;
  let SEGMENTS = DEFAULT_SEGMENTS;

  const FRAMES = {
    entry:    { chapter: 'The Threshold', title: 'Beyond the façade', subtitle: 'Scroll slowly. Each frame unveils the next room — a dance between scenes, not a leap.', detail: null },
    lobby:    { chapter: '01 — Arrival', title: 'The lobby breathes gold', subtitle: 'Marble columns rise like quiet monuments. Chandeliers hold the night in amber glass.', detail: { notes: ['Marble atrium', 'Champagne reception', 'Private concierge'], price: 'From €840', cta: 'Reserve Arrival Suite' } },
    corridor: { chapter: '02 — Passage', title: 'Corridors that remember', subtitle: 'Each step deepens the hush. Sconces paint the walls in slow fire.', detail: { notes: ['Velvet silence', 'Brass sconce light', 'Scent of cedar'], price: 'From €620', cta: 'Explore Passage' } },
    suite:    { chapter: '03 — Residence', title: 'Your suite above the city', subtitle: 'Silk, glass, and the whole skyline laid at your feet.', detail: { notes: ['Panoramic glass', 'Silk linens', 'Midnight skyline'], price: 'From €1,200', cta: 'Book Penthouse' } },
    spa:      { chapter: '04 — Submersion', title: 'The spa at the edge of sleep', subtitle: 'Steam, stone, candlelight on black water. Time dissolves here.', detail: { notes: ['Thermal stone', 'Black water pool', 'Candlelit steam'], price: 'From €480', cta: 'Reserve Ritual' } },
    complete: { chapter: 'The Return', title: 'You crossed the veil.', subtitle: 'The circle is complete. Scroll again to walk the path once more.', detail: null },
  };

  const SCENE_ORDER = ['exterior', 'lobby', 'corridor', 'suite', 'spa'];
  const FRAME_TO_SCENE = { entry: 'exterior', lobby: 'lobby', corridor: 'corridor', suite: 'suite', spa: 'spa', complete: 'spa' };
  let sceneSegMap = {};
  let TIMELINE = [];

  function rebuildSceneSegMap() {
    sceneSegMap = {};
    SEGMENTS.forEach(s => {
      const scene = s.scene || FRAME_TO_SCENE[s.frameId];
      if (scene && s.id !== 'outro') sceneSegMap[scene] = { ...s, scene };
    });
  }
  rebuildSceneSegMap();

  /* ── DOM ── */
  const hero = document.getElementById('hero');
  const idleVid = document.getElementById('idleVid');
  const expVid = document.getElementById('expVid');
  const idleFallback = document.getElementById('idleFallback');
  const expFallback = document.getElementById('expFallback');
  const scrollHint = document.getElementById('scrollHint');
  const panels = document.getElementById('panels');
  const framePanel = document.getElementById('framePanel');
  const detailPanel = document.getElementById('detailPanel');
  const chapterDots = document.getElementById('chapterDots');
  const header = document.getElementById('header');
  const sceneLayers = [...document.querySelectorAll('.scene-layer')];
  const danceScenes = [...document.querySelectorAll('.dance-scene')];
  const transitionVeil = document.getElementById('transitionVeil');
  const transitionMist = document.getElementById('transitionMist');
  const danceLayer = document.getElementById('danceLayer');

  let useVideo = false;
  let TOTAL_SCROLL_PX = TOTAL_VIDEO_DURATION * PX_PER_SECOND;

  async function probeVideoMode() {
    try {
      const meta = await fetch('assets/hotel/video_meta.json').then(r => r.ok ? r.json() : null);
      if (meta?.experience) {
        TOTAL_VIDEO_DURATION = meta.experience;
        if (meta.segments_hint) {
          SEGMENTS = meta.segments_hint;
          rebuildSceneSegMap();
        }
        if (meta.timeline) TIMELINE = meta.timeline;
        if (meta.experience_file && expVid) {
          const src = expVid.querySelector('source');
          if (src) src.src = 'assets/hotel/' + meta.experience_file;
          expVid.load();
        }
      }
    } catch (_) {}

    const introOk = await new Promise(resolve => {
      if (!idleVid) return resolve(false);
      const done = () => { idleVid.removeEventListener('loadeddata', done); resolve(idleVid.readyState >= 2); };
      if (idleVid.readyState >= 2) return resolve(true);
      idleVid.addEventListener('loadeddata', done);
      idleVid.addEventListener('error', () => resolve(false), { once: true });
    });

    const expOk = await new Promise(resolve => {
      if (!expVid) return resolve(false);
      const done = () => {
        expVid.removeEventListener('loadedmetadata', done);
        if (expVid.duration && isFinite(expVid.duration)) {
          TOTAL_VIDEO_DURATION = expVid.duration;
          if (SEGMENTS === DEFAULT_SEGMENTS) {
            const d = TOTAL_VIDEO_DURATION;
            SEGMENTS = [
              { id: 'entry', frameId: 'entry', transitionStart: 0, transitionEnd: d*0.08, loopStart: d*0.05, loopEnd: d*0.1, scrollResume: d*0.1 },
              { id: 'lobby', frameId: 'lobby', transitionStart: d*0.08, transitionEnd: d*0.22, loopStart: d*0.18, loopEnd: d*0.26, scrollResume: d*0.26 },
              { id: 'corridor', frameId: 'corridor', transitionStart: d*0.22, transitionEnd: d*0.38, loopStart: d*0.34, loopEnd: d*0.42, scrollResume: d*0.42 },
              { id: 'suite', frameId: 'suite', transitionStart: d*0.38, transitionEnd: d*0.58, loopStart: d*0.52, loopEnd: d*0.62, scrollResume: d*0.62 },
              { id: 'spa', frameId: 'spa', transitionStart: d*0.58, transitionEnd: d*0.78, loopStart: d*0.72, loopEnd: d*0.82, scrollResume: d*0.82 },
              { id: 'outro', frameId: 'complete', transitionStart: d*0.78, transitionEnd: d, loopStart: d*0.85, loopEnd: d, scrollResume: d },
            ];
          }
        }
        resolve(expVid.readyState >= 1);
      };
      if (expVid.readyState >= 1) done();
      else {
        expVid.addEventListener('loadedmetadata', done);
        expVid.addEventListener('error', () => resolve(false), { once: true });
      }
    });

    useVideo = introOk && expOk;
    TOTAL_SCROLL_PX = TOTAL_VIDEO_DURATION * PX_PER_SECOND;

    if (!useVideo) {
      idleVid.hidden = true;
      expVid.hidden = true;
      danceLayer.hidden = true;
      idleFallback.hidden = false;
      expFallback.hidden = false;
    } else {
      idleFallback.hidden = true;
      expFallback.hidden = true;
      danceLayer.hidden = false;
      expVid.pause();
    }
    return useVideo;
  }

  await probeVideoMode();

  SEGMENTS.filter(s => s.id !== 'entry' && s.id !== 'outro').forEach(s => {
    const dot = document.createElement('span');
    dot.dataset.frame = s.frameId;
    chapterDots.appendChild(dot);
  });

  /* ── CURSOR ── */
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0, cursorReady = false;

  function attachCursorHover() {
    document.querySelectorAll('a, button, [data-cursor-hover]').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hovering'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hovering'));
    });
  }
  document.addEventListener('mousemove', e => {
    mouseX = e.clientX; mouseY = e.clientY;
    dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px';
    if (!cursorReady) { dot.style.opacity = ring.style.opacity = '1'; cursorReady = true; }
  });
  (function cursorTick() {
    ringX += (mouseX - ringX) * 0.12;
    ringY += (mouseY - ringY) * 0.12;
    ring.style.left = ringX + 'px'; ring.style.top = ringY + 'px';
    requestAnimationFrame(cursorTick);
  })();
  attachCursorHover();
  new MutationObserver(attachCursorHover).observe(document.body, { childList: true, subtree: true });

  /* ── STATE ── */
  let mode = 'IDLE';
  let currentFrameId = 'entry';
  let targetTime = 0;
  let smoothedTime = 0;
  let lastSeekMs = 0;
  let lastProgress = 0;
  let lastProgressMs = Date.now();
  let isResetting = false;
  let loopAnimStart = 0;
  let segment = SEGMENTS[0];
  let panelFrameId = null;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smoother = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

  function segmentFromTime(t) {
    for (let i = SEGMENTS.length - 1; i >= 0; i--) {
      if (t >= SEGMENTS[i].transitionStart) return SEGMENTS[i];
    }
    return SEGMENTS[0];
  }

  function frameFromSegment(seg) {
    return FRAMES[seg.frameId] || FRAMES.entry;
  }

  function sceneWeightForTime(t, sceneKey) {
    const seg = sceneSegMap[sceneKey];
    if (!seg) return 0;
    const idx = SCENE_ORDER.indexOf(sceneKey);
    const nextKey = SCENE_ORDER[idx + 1];
    const nextSeg = nextKey ? sceneSegMap[nextKey] : null;

    const fadeIn = clamp((t - seg.transitionStart) / (seg.transitionEnd - seg.transitionStart), 0, 1);
    let w = smoother(fadeIn);
    if (nextSeg && t > nextSeg.transitionStart) {
      const fadeOut = clamp((t - nextSeg.transitionStart) / (nextSeg.transitionEnd - nextSeg.transitionStart), 0, 1);
      w *= 1 - smoother(fadeOut);
    }
    return w;
  }

  function transitionBlendAt(t) {
    let blend = 0;
    if (TIMELINE.length) {
      TIMELINE.filter(c => c.kind === 'transition').forEach(tr => {
        const mid = (tr.start + tr.end) / 2;
        const half = Math.max((tr.end - tr.start) / 2, 0.5);
        const d = Math.abs(t - mid) / half;
        if (d < 1) blend = Math.max(blend, 1 - smoother(clamp(1 - d, 0, 1)));
      });
    } else {
      for (let i = 1; i < SCENE_ORDER.length; i++) {
        const next = sceneSegMap[SCENE_ORDER[i]];
        if (!next) continue;
        const w = clamp((t - next.transitionStart) / Math.max(next.transitionEnd - next.transitionStart, 0.01), 0, 1);
        if (w > 0 && w < 1) blend = Math.max(blend, Math.sin(w * Math.PI));
      }
    }
    return clamp(blend, 0, 1);
  }

  function applyDanceLayer(t, loopPhase) {
    const blend = transitionBlendAt(t);
    const inTransition = blend > 0.08;
    const holdFade = inTransition ? 0.35 : 0.92;

    danceScenes.forEach(layer => {
      const key = layer.dataset.scene;
      const w = sceneWeightForTime(t, key);
      const img = layer.querySelector('img');
      const seg = sceneSegMap[key];
      const local = seg ? clamp((t - seg.loopStart) / Math.max(seg.loopEnd - seg.loopStart, 0.01), 0, 1) : 0;
      const breathe = loopPhase !== null ? Math.sin(loopPhase * Math.PI * 2) * 0.012 : Math.sin(local * Math.PI) * 0.006;
      const drift = (key === 'corridor' || key === 'spa' ? -1 : 1) * (1.2 + breathe * 30);

      const holdOpacity = w * holdFade;
      const transOpacity = inTransition ? w * (0.55 + blend * 0.45) : w * 0.08;
      const opacity = inTransition ? Math.max(holdOpacity, transOpacity) : holdOpacity;

      layer.style.opacity = opacity;
      img.style.transform = `translate3d(${drift * blend}%, ${breathe * 80}%, 0) scale(${1.04 + breathe + blend * 0.06})`;
      img.style.filter = `brightness(${0.58 + w * 0.3}) saturate(${0.9 + w * 0.12})`;
    });

    transitionVeil.style.opacity = blend * 0.75;
    transitionMist.style.opacity = blend * 0.65;
    transitionMist.style.transform = `translateX(${blend * 6 - 3}%) scale(${1 + blend * 0.05})`;

    if (useVideo && expVid) {
      const vidBlur = inTransition ? blend * 4 : 0;
      expVid.style.filter = `brightness(${0.88 + blend * 0.08}) saturate(${0.95 + blend * 0.1}) blur(${vidBlur}px)`;
    }
  }

  function applyVisualTime(t, loopPhase) {
    applyDanceLayer(t, loopPhase);
    sceneLayers.forEach(layer => {
      const key = layer.dataset.scene;
      const w = sceneWeightForTime(t, key);
      const img = layer.querySelector('img');
      const seg = sceneSegMap[key];
      const local = seg ? clamp((t - seg.loopStart) / Math.max(seg.loopEnd - seg.loopStart, 0.01), 0, 1) : 0;
      const breathe = loopPhase !== null
        ? Math.sin(loopPhase * Math.PI * 2) * 0.015
        : Math.sin(local * Math.PI) * 0.008;
      const drift = (key === 'corridor' || key === 'spa' ? -1 : 1) * (0.6 + breathe * 40);
      const scale = 1.06 + breathe + (w * 0.04);
      layer.style.opacity = w;
      img.style.transform = `translate3d(${drift * (1 - w * 0.5)}%, ${breathe * 100}%, 0) scale(${scale})`;
      img.style.filter = `brightness(${0.52 + w * 0.35}) saturate(${0.88 + w * 0.15}) blur(${(1 - w) * 5}px)`;
    });
  }

  function renderDetail(frame) {
    const inner = document.getElementById('detailInner');
    if (!frame.detail) { detailPanel.style.display = 'none'; return; }
    detailPanel.style.display = '';
    inner.innerHTML = `
      <p class="detail-label">Experience</p>
      <h3 class="detail-title">${frame.title}</h3>
      <ul class="detail-notes">${frame.detail.notes.map(n => `<li>${n}</li>`).join('')}</ul>
      <p class="detail-price">${frame.detail.price}</p>
      <button class="btn-outline" data-cursor-hover>${frame.detail.cta}</button>
      <a class="btn-link" href="#footer" data-cursor-hover>Discover more</a>`;
    attachCursorHover();
  }

  function updatePanels(frameId, animate) {
    if (NO_PANEL_FRAMES.has(frameId)) {
      panels.classList.remove('visible');
      return;
    }
    panels.classList.add('visible');
    if (frameId === panelFrameId) return;
    const frame = FRAMES[frameId];
    if (!frame) return;

    const swap = () => {
      document.getElementById('frameChapter').textContent = frame.chapter || '';
      document.getElementById('frameTitle').textContent = frame.title;
      document.getElementById('frameSub').textContent = frame.subtitle;
      renderDetail(frame);
      framePanel.className = 'glass panel-card show';
      detailPanel.className = 'glass panel-card right show';
      panelFrameId = frameId;
    };

    if (animate && panelFrameId) {
      framePanel.className = 'glass panel-card exit-left';
      detailPanel.className = 'glass panel-card right exit-right';
      setTimeout(swap, 280);
    } else {
      swap();
    }

    chapterDots.querySelectorAll('span').forEach(d => {
      d.classList.toggle('lit', d.dataset.frame === frameId);
    });
  }

  function setMode(next) {
    mode = next;
    const isIdle = mode === 'IDLE';
    if (useVideo) {
      idleVid.classList.toggle('off', !isIdle);
      expVid.classList.toggle('on', !isIdle);
      if (isIdle) {
        idleVid.play().catch(() => {});
        expVid.pause();
      } else {
        idleVid.pause();
      }
    } else {
      idleFallback.classList.toggle('off', !isIdle);
      expFallback.classList.toggle('on', !isIdle);
    }
    scrollHint.classList.toggle('visible', isIdle);
    chapterDots.classList.toggle('visible', !isIdle);
    if (isIdle) {
      panels.classList.remove('visible');
      panelFrameId = null;
    }
  }

  function clampTargetToSegment(t, seg) {
    return clamp(t, seg.transitionStart, seg.scrollResume);
  }

  /* ── LENIS + GSAP TICKER ── */
  const lenis = new Lenis({
    duration: 1.6,
    easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    smoothWheel: true,
    touchMultiplier: 1.2,
  });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add(t => lenis.raf(t * 1000));
  gsap.ticker.lagSmoothing(0);

  hero.style.minHeight = `calc(100vh + ${TOTAL_SCROLL_PX}px)`;

  ScrollTrigger.create({
    trigger: hero,
    start: 'top top',
    end: `+=${TOTAL_SCROLL_PX}`,
    pin: stage,
    pinSpacing: true,
    anticipatePin: 1,
    onUpdate(self) {
      if (isResetting) return;
      const p = self.progress;

      if (Math.abs(p - lastProgress) > 0.0008) {
        lastProgress = p;
        lastProgressMs = Date.now();
      }

      if (p < 0.004) {
        if (mode !== 'IDLE') {
          setMode('IDLE');
          targetTime = 0;
          smoothedTime = 0;
          currentFrameId = 'entry';
          segment = SEGMENTS[0];
          loopAnimStart = 0;
        }
        return;
      }

      if (mode === 'IDLE') {
        setMode('SCRUB');
      } else if (mode === 'LOOP') {
        setMode('SCRUB');
        loopAnimStart = 0;
      }

      let next = p * TOTAL_VIDEO_DURATION;
      const seg = segmentFromTime(next);
      segment = seg;
      next = clampTargetToSegment(next, seg);
      targetTime = next;

      const frameId = seg.frameId;
      if (frameId !== currentFrameId) {
        currentFrameId = frameId;
        updatePanels(frameId, mode !== 'IDLE');
      } else if (!NO_PANEL_FRAMES.has(frameId)) {
        updatePanels(frameId, false);
      }

      if (p > 0.98 && !isResetting) {
        isResetting = true;
        setTimeout(() => {
          gsap.to(window, {
            scrollTo: { y: 0, autoKill: false },
            duration: 2.5,
            ease: 'power2.inOut',
            onComplete() {
              setMode('IDLE');
              targetTime = smoothedTime = 0;
              currentFrameId = 'entry';
              segment = SEGMENTS[0];
              panelFrameId = null;
              isResetting = false;
              if (useVideo) {
                expVid.currentTime = 0;
                expVid.pause();
              } else {
                applyVisualTime(0, null);
              }
            }
          });
        }, 1500);
      }
    }
  });

  function seekVideo(time) {
    if (!useVideo || expVid.readyState < 2) return;
    if (Math.abs(expVid.currentTime - time) > 0.04) {
      expVid.currentTime = time;
    }
  }

  /* ── RAF: lerp time + LOOP ambient ── */
  function rafLoop(timestamp) {
    const delta = targetTime - smoothedTime;
    if (Math.abs(delta) > 0.0005) {
      smoothedTime += delta * LERP_FACTOR;
    }

    if (timestamp - lastSeekMs >= SEEK_INTERVAL_MS) {
      let displayTime = smoothedTime;
      let loopPhase = null;

      if (mode === 'SCRUB' && Date.now() - lastProgressMs > 550) {
        mode = 'LOOP';
        loopAnimStart = timestamp;
      }

      if (mode === 'LOOP' && segment) {
        const dur = Math.max(segment.loopEnd - segment.loopStart, 0.5);
        loopPhase = ((timestamp - loopAnimStart) / 1000) % 1;
        displayTime = segment.loopStart + loopPhase * dur;
        smoothedTime += (displayTime - smoothedTime) * 0.15;
        if (useVideo) {
          if (expVid.paused) expVid.play().catch(() => {});
          if (displayTime >= segment.loopEnd || displayTime < segment.loopStart) {
            displayTime = segment.loopStart;
          }
          seekVideo(displayTime);
        } else {
          applyVisualTime(smoothedTime, loopPhase);
        }
      } else if (useVideo && mode !== 'IDLE') {
        expVid.pause();
        seekVideo(smoothedTime);
        applyDanceLayer(smoothedTime, loopPhase);
      } else if (!useVideo) {
        applyVisualTime(smoothedTime, loopPhase);
      }

      lastSeekMs = timestamp;
    }

    requestAnimationFrame(rafLoop);
  }
  requestAnimationFrame(rafLoop);

  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 60);
  }, { passive: true });

  setMode('IDLE');
  applyDanceLayer(0, null);
  if (!useVideo) applyVisualTime(0, null);
})();
  </script>
</body>
</html>
