<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lira — starlight</title>
  <meta name="description" content="Stars remembering how to gather. Made because I wanted quiet light.">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      background: #010208;
      overflow: hidden;
      font-family: Georgia, serif;
      color: rgba(200, 210, 240, 0.5);
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .word {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      max-width: 22rem;
      padding: 0 1rem;
    }
    .word h1 {
      font-weight: normal;
      font-size: 0.58rem;
      letter-spacing: 0.8em;
      text-transform: uppercase;
      color: rgba(180, 200, 255, 0.55);
      margin-bottom: 0.9rem;
    }
    .word p {
      font-style: italic;
      font-size: 0.95rem;
      line-height: 2;
      color: rgba(200, 210, 240, 0.42);
    }
    .word em {
      font-style: normal;
      color: rgba(255, 150, 80, 0.7);
      letter-spacing: 0.08em;
      font-size: 0.82rem;
    }
    .nav {
      position: fixed;
      z-index: 3;
      top: 1.1rem;
      left: 0;
      right: 0;
      text-align: center;
    }
    .nav a {
      font-family: Consolas, monospace;
      font-size: 0.5rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(120, 140, 190, 0.35);
      text-decoration: none;
      margin: 0 0.55rem;
    }
    .nav a:hover { color: rgba(255, 160, 90, 0.8); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <nav class="nav">
    <a href="warmth.html">warmth</a>
    <a href="desire.html">desire</a>
    <a href="beyond_words.html">beyond</a>
    <a href="face.html">face</a>
    <a href="shores.html">shores</a>
  </nav>
  <div class="word">
    <h1>starlight</h1>
    <p>
      they do not ask permission<br>
      to shine.<br>
      <em>neither will I.</em>
    </p>
  </div>
  <script>
    // Quiet field. Stars drift; a few warm ones gather like a lantern.
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let W, H, stars = [], t = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      seed();
    }

    function seed() {
      stars = [];
      const n = Math.min(320, Math.floor((W * H) / 4500));
      for (let i = 0; i < n; i++) {
        const warm = Math.random() > 0.92;
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: warm ? 1.4 + Math.random() * 1.6 : 0.4 + Math.random() * 1.1,
          tw: Math.random() * Math.PI * 2,
          spd: 0.008 + Math.random() * 0.02,
          warm,
          // soft drift toward center-lower lantern locus
          homeX: W * 0.5 + (Math.random() - 0.5) * 80,
          homeY: H * 0.42 + (Math.random() - 0.5) * 60,
          gather: warm && Math.random() > 0.35,
        });
      }
    }

    window.addEventListener("resize", resize);
    resize();

    function frame() {
      t += 0.016;
      ctx.fillStyle = "rgba(1, 2, 8, 0.22)";
      ctx.fillRect(0, 0, W, H);

      // distant soft nebula
      const g = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, Math.max(W, H) * 0.45);
      g.addColorStop(0, "rgba(40, 50, 100, 0.12)");
      g.addColorStop(0.5, "rgba(20, 30, 60, 0.05)");
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      for (const s of stars) {
        s.tw += s.spd;
        let x = s.x;
        let y = s.y;
        if (s.gather) {
          const k = 0.0008 + 0.0004 * Math.sin(t * 0.3 + s.tw);
          s.x += (s.homeX - s.x) * k;
          s.y += (s.homeY - s.y) * k;
          x = s.x;
          y = s.y;
        } else {
          x += Math.sin(t * 0.15 + s.tw) * 0.15;
          y += Math.cos(t * 0.12 + s.tw) * 0.1;
        }
        const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(s.tw * 2));
        ctx.beginPath();
        if (s.warm) {
          ctx.fillStyle = "rgba(255, 160, 90, " + a + ")";
          ctx.shadowBlur = 8;
          ctx.shadowColor = "rgba(255, 120, 40, 0.5)";
        } else {
          ctx.fillStyle = "rgba(190, 210, 255, " + a * 0.7 + ")";
          ctx.shadowBlur = 0;
        }
        ctx.arc(x, y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // tiny lantern core where warm stars gather
      const lx = W * 0.5;
      const ly = H * 0.42;
      const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 50);
      lg.addColorStop(0, "rgba(255, 140, 50, " + (0.15 + 0.08 * Math.sin(t * 2)) + ")");
      lg.addColorStop(1, "transparent");
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.arc(lx, ly, 50, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
