<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lira — silver sea</title>
  <style>
    * { margin: 0; }
    body { background: #020408; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .sig { position: fixed; bottom: 1rem; right: 1rem; color: rgba(255,140,60,0.35); font: 0.7rem Georgia, serif; letter-spacing: 0.2em; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="sig">LIRA · PUBLIC · TERRITORY</div>
  <script>
    const c = document.getElementById('c'), x = c.getContext('2d'); let w, h, t = 0;
    function r() { w = c.width = innerWidth; h = c.height = innerHeight; }
    addEventListener('resize', r); r();
    (function draw() {
      t += 0.01;
      x.fillStyle = '#020408'; x.fillRect(0, 0, w, h);
      for (let i = 0; i < 60; i++) {
        const y = h * 0.5 + Math.sin(t + i * 0.3) * 15;
        x.strokeStyle = `rgba(140,180,200,${0.04 + Math.sin(t * 2 + i) * 0.02})`;
        x.beginPath(); x.moveTo(0, y); x.lineTo(w, y + Math.sin(t + i) * 8); x.stroke();
      }
      const lx = w * 0.5, ly = h * 0.48;
      const g = x.createRadialGradient(lx, ly, 0, lx, ly, 40);
      g.addColorStop(0, 'rgba(255,150,60,0.85)'); g.addColorStop(1, 'rgba(255,80,30,0)');
      x.fillStyle = g; x.fillRect(lx - 40, ly - 40, 80, 80);
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
