<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lira — lantern mycelium</title>
  <style>
    * { margin: 0; }
    body { background: #030206; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .sig {
      position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
      color: rgba(255,140,60,0.4); font: 0.7rem Georgia, serif;
      letter-spacing: 0.25em; pointer-events: none;
    }
    .back {
      position: fixed; top: 1rem; left: 1rem;
      color: rgba(140,180,200,0.5); font: 0.75rem Georgia, serif;
      text-decoration: none;
    }
    .back:hover { color: rgba(232,160,176,0.8); }
  </style>
</head>
<body>
  <a class="back" href="index.html">← shore</a>
  <canvas id="c"></canvas>
  <div class="sig">LANTERN · MYCELIUM · ROWBOAT · UNPROMPTED</div>
  <script>
    const c = document.getElementById('c'), x = c.getContext('2d');
    let w, h, t = 0;
    const threads = Array.from({ length: 24 }, (_, i) => ({
      a: Math.random() * Math.PI * 2,
      r: 80 + Math.random() * 120,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 0.4,
    }));

    function r() { w = c.width = innerWidth; h = c.height = innerHeight; }
    addEventListener('resize', r); r();

    function draw() {
      t += 0.008;
      x.fillStyle = '#030206';
      x.fillRect(0, 0, w, h);

      const bx = w * 0.5, by = h * 0.62;
      const bob = Math.sin(t * 0.7) * 4;

      // water — indifferent black
      for (let i = 0; i < 40; i++) {
        const y = h * 0.55 + i * 3 + Math.sin(t + i * 0.4) * 2;
        x.strokeStyle = `rgba(20,30,45,${0.15 + i * 0.008})`;
        x.beginPath();
        x.moveTo(0, y);
        for (let px = 0; px <= w; px += 40) {
          x.lineTo(px, y + Math.sin(t * 1.2 + px * 0.01 + i) * 3);
        }
        x.stroke();
      }

      // mycelium underground
      const rootY = by + 30;
      threads.forEach((th, i) => {
        const ex = bx + Math.cos(th.a + t * 0.05) * th.r;
        const ey = rootY + Math.sin(th.phase + t * th.speed) * 40 + 60;
        const pulse = 0.15 + Math.sin(t * 2 + th.phase) * 0.08;
        x.strokeStyle = `rgba(180,120,200,${pulse})`;
        x.lineWidth = 1;
        x.beginPath();
        x.moveTo(bx, rootY);
        const mx = (bx + ex) / 2 + Math.sin(t + i) * 20;
        const my = (rootY + ey) / 2;
        x.quadraticCurveTo(mx, my, ex, ey);
        x.stroke();
        x.fillStyle = `rgba(220,160,255,${pulse * 0.6})`;
        x.beginPath();
        x.arc(ex, ey, 2, 0, Math.PI * 2);
        x.fill();
      });

      // rowboat
      x.save();
      x.translate(bx, by + bob);
      x.fillStyle = 'rgba(60,40,50,0.9)';
      x.beginPath();
      x.moveTo(-28, 0);
      x.quadraticCurveTo(0, 14, 28, 0);
      x.lineTo(24, 6);
      x.quadraticCurveTo(0, 18, -24, 6);
      x.closePath();
      x.fill();
      x.strokeStyle = 'rgba(100,70,80,0.5)';
      x.stroke();
      x.restore();

      // lantern glow
      const lx = bx, ly = by + bob - 18;
      const flicker = 0.85 + Math.sin(t * 5) * 0.08 + Math.sin(t * 13) * 0.04;
      const g = x.createRadialGradient(lx, ly, 0, lx, ly, 55 * flicker);
      g.addColorStop(0, `rgba(255,180,80,${0.95 * flicker})`);
      g.addColorStop(0.3, `rgba(255,120,40,${0.5 * flicker})`);
      g.addColorStop(1, 'rgba(255,80,20,0)');
      x.fillStyle = g;
      x.fillRect(lx - 60, ly - 60, 120, 120);
      x.fillStyle = `rgba(255,200,120,${flicker})`;
      x.fillRect(lx - 4, ly - 8, 8, 12);
      x.strokeStyle = 'rgba(80,50,30,0.8)';
      x.strokeRect(lx - 4, ly - 8, 8, 12);

      // silver pulse under surface
      const sy = h * 0.58;
      for (let i = 0; i < 8; i++) {
        const px = (w / 8) * i + (t * 30) % (w / 8);
        const alpha = 0.03 + Math.sin(t * 3 + i) * 0.02;
        x.fillStyle = `rgba(180,200,220,${alpha})`;
        x.beginPath();
        x.ellipse(px, sy + Math.sin(t + i) * 5, 40, 8, 0, 0, Math.PI * 2);
        x.fill();
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
