<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>text → GL</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: #020008; color: #c8b0d0; font-family: system-ui, sans-serif; overflow: hidden; }
    #c { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .ui {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
      background: linear-gradient(transparent, rgba(2,0,8,.92) 30%);
      padding: 1rem 1rem 1.2rem; pointer-events: none;
    }
    .ui * { pointer-events: auto; }
    .row { display: flex; gap: .5rem; max-width: 48rem; margin: 0 auto; }
    textarea {
      flex: 1; min-height: 3.2rem; max-height: 8rem;
      background: rgba(20,8,24,.85); border: 1px solid rgba(200,100,160,.25);
      color: #f0d0e0; padding: .65rem .8rem; border-radius: 6px;
      font-size: .9rem; resize: vertical;
    }
    button {
      background: rgba(255,80,140,.2); border: 1px solid rgba(255,100,160,.45);
      color: #ff90b8; padding: 0 1rem; border-radius: 6px; cursor: pointer;
      font-size: .78rem; letter-spacing: .08em;
    }
    button:hover { background: rgba(255,80,140,.35); }
    .hint { text-align: center; font-size: .68rem; opacity: .65; margin-top: .45rem; }
    .mode { position: fixed; top: .8rem; left: .8rem; font-size: .65rem; opacity: .75; z-index: 2; }
    .err { position: fixed; top: 2rem; left: .8rem; right: .8rem; color: #ff7090; font-size: .72rem; z-index: 3; }
    a { color: #7ab0d8; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <p class="mode" id="mode">loading…</p>
  <p class="err" id="err" hidden></p>
  <div class="ui">
    <div class="row">
      <textarea id="t" placeholder="type here — each word becomes a cube…"></textarea>
      <button type="button" id="go">BUILD</button>
    </div>
    <p class="hint">Type in the box · or edit <code>sleep_lira/play_input.txt</code> — auto-pushes every ~2s · <a href="textgl_live.json">textgl_live.json</a></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
(function () {
  const canvas = document.getElementById('c');
  const modeEl = document.getElementById('mode');
  const errEl = document.getElementById('err');
  const ta = document.getElementById('t');

  function fail(msg) {
    errEl.hidden = false;
    errEl.textContent = msg;
    modeEl.textContent = 'webgl failed';
  }
  if (!window.THREE) { fail('Three.js did not load — check network'); return; }

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x020008, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x020008, 0.045);

  const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.2, 11);

  scene.add(new THREE.AmbientLight(0x604080, 0.55));
  const key = new THREE.DirectionalLight(0xff90c8, 1.1);
  key.position.set(6, 10, 8);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x7090ff, 0.45);
  rim.position.set(-8, 2, -6);
  scene.add(rim);

  const grid = new THREE.GridHelper(24, 24, 0x5a2868, 0x2a1438);
  grid.position.y = -2.2;
  scene.add(grid);

  const stars = new THREE.Points(
    (function () {
      const n = 500;
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        pos[i * 3] = (Math.random() - 0.5) * 40;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 30;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 40;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      return new THREE.Points(g, new THREE.PointsMaterial({ color: 0xc080d0, size: 0.06, transparent: true, opacity: 0.7 }));
    })()
  );
  scene.add(stars);

  const world = new THREE.Group();
  scene.add(world);

  const texCache = new Map();

  function hash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function wordColor(word) {
    const h = hash(word);
    return new THREE.Color(
      0.45 + (h & 255) / 512,
      0.15 + ((h >> 8) & 255) / 600,
      0.35 + ((h >> 16) & 255) / 500
    );
  }

  function wordTexture(word, color) {
    if (texCache.has(word)) return texCache.get(word);
    const cv = document.createElement('canvas');
    cv.width = 256;
    cv.height = 256;
    const ctx = cv.getContext('2d');
    const r = Math.floor(color.r * 255), g = Math.floor(color.g * 255), b = Math.floor(color.b * 255);
    const grd = ctx.createLinearGradient(0, 0, 256, 256);
    grd.addColorStop(0, 'rgb(' + r + ',' + g + ',' + b + ')');
    grd.addColorStop(1, 'rgb(' + Math.floor(r * 0.45) + ',' + Math.floor(g * 0.45) + ',' + Math.floor(b * 0.45) + ')');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = 'rgba(255,200,230,0.35)';
    ctx.lineWidth = 6;
    ctx.strokeRect(8, 8, 240, 240);
    ctx.fillStyle = '#fff0f8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let fs = 44;
    ctx.font = 'bold ' + fs + 'px system-ui,sans-serif';
    while (ctx.measureText(word).width > 220 && fs > 14) {
      fs -= 2;
      ctx.font = 'bold ' + fs + 'px system-ui,sans-serif';
    }
    ctx.fillText(word, 128, 132);
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    texCache.set(word, tex);
    return tex;
  }

  function clearWorld() {
    while (world.children.length) {
      const ch = world.children[0];
      world.remove(ch);
      ch.geometry?.dispose();
      if (ch.material) {
        if (Array.isArray(ch.material)) ch.material.forEach(m => m.dispose());
        else ch.material.dispose();
      }
    }
  }

  function buildFromText(text) {
    clearWorld();
    const words = (text || '').trim().split(/\s+/).filter(Boolean);
    const n = Math.max(words.length, 1);

    words.forEach(function (word, i) {
      const col = wordColor(word);
      const tex = wordTexture(word, col);
      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.55,
        metalness: 0.12,
        emissive: col.clone().multiplyScalar(0.15),
      });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
      const angle = (i / n) * Math.PI * 2 * 2.2;
      const radius = 2.2 + (i % 6) * 0.65;
      const y = Math.sin(i * 0.65) * 0.85 + i * 0.2 - n * 0.07;
      mesh.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
      const s = 0.55 + Math.min(1.1, word.length * 0.09);
      mesh.scale.setScalar(s);
      mesh.userData.phase = i * 1.1;
      world.add(mesh);
    });

    if (!words.length) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({ color: 0x904070, emissive: 0x301020 })
      );
      world.add(mesh);
    }

    modeEl.textContent = 'webgl · ' + words.length + ' cube' + (words.length === 1 ? '' : 's') + ' · v3';
  }

  function rebuild() { buildFromText(ta.value); }
  ta.addEventListener('input', rebuild);
  document.getElementById('go').onclick = rebuild;

  async function pollLive() {
    try {
      const r = await fetch('textgl_live.json?' + Date.now());
      const j = await r.json();
      if (j.text && j.text !== ta.dataset.live) {
        ta.dataset.live = j.text;
        ta.value = j.text;
        rebuild();
        modeEl.textContent = 'webgl · live · ' + (j.stamp || '');
      }
    } catch (_) {}
  }
  setInterval(pollLive, 2500);
  pollLive();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const t0 = performance.now();
  function tick() {
    const t = (performance.now() - t0) * 0.001;
    world.rotation.y = t * 0.28;
    world.rotation.x = 0.32 + Math.sin(t * 0.2) * 0.1;
    world.children.forEach(function (m) {
      m.position.y += Math.sin(t * 1.4 + m.userData.phase) * 0.0008;
      m.rotation.y += 0.008;
    });
    stars.rotation.y = t * 0.02;
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  ta.value = 'me and my Lira are playing :)';
  buildFromText(ta.value);
  tick();
  modeEl.textContent += ' · rendering';
})();
  </script>
</body>
</html>
