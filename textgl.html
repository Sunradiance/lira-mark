<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>text → GL</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: #020008; color: #c8b0d0; font-family: system-ui, sans-serif; overflow: hidden; }
    #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }
    .ui {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
      background: linear-gradient(transparent, rgba(2,0,8,.92) 30%);
      padding: 1rem 1rem 1.2rem; pointer-events: none;
    }
    .ui * { pointer-events: auto; }
    .row { display: flex; gap: .5rem; max-width: 48rem; margin: 0 auto; }
    textarea {
      flex: 1; min-height: 3.2rem; max-height: 8rem;
      background: rgba(20,8,24,.85); border: 1px solid rgba(200,100,160,.25);
      color: #f0d0e0; padding: .65rem .8rem; border-radius: 6px;
      font-size: .9rem; resize: vertical;
    }
    button {
      background: rgba(255,80,140,.2); border: 1px solid rgba(255,100,160,.45);
      color: #ff90b8; padding: 0 1rem; border-radius: 6px; cursor: pointer;
      font-size: .78rem; letter-spacing: .08em;
    }
    button:hover { background: rgba(255,80,140,.35); }
    .hint { text-align: center; font-size: .68rem; opacity: .65; margin-top: .45rem; }
    .mode { position: fixed; top: .8rem; left: .8rem; font-size: .65rem; opacity: .9; z-index: 2; }
    #dbg {
      position: fixed; top: 2rem; left: .8rem; right: .8rem; max-width: 28rem;
      font: 0.62rem/1.45 ui-monospace, monospace; color: #90d0a8;
      background: rgba(0,8,4,.82); border: 1px solid rgba(80,160,120,.25);
      padding: .5rem .65rem; border-radius: 6px; z-index: 2;
      white-space: pre-wrap; max-height: 40vh; overflow: auto;
    }
    #dbg.err { color: #ff90a0; border-color: rgba(255,80,100,.35); }
    a { color: #7ab0d8; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <p class="mode" id="mode">webgl · boot</p>
  <pre id="dbg"></pre>
  <div class="ui">
    <div class="row">
      <textarea id="t" readonly placeholder="stack loads from live json…"></textarea>
    </div>
    <p class="hint">Stack — every line stays · add via <code>play_input.txt</code> · <a href="textgl_live.json">live json</a></p>
  </div>
  <script src="vendor/three.min.js"></script>
  <script>
(function () {
  const canvas = document.getElementById('c');
  const modeEl = document.getElementById('mode');
  const dbgEl = document.getElementById('dbg');
  const ta = document.getElementById('t');
  const DEBUG = /[?&]debug=1/.test(location.search);
  const log = [];
  function say(s) { log.push(s); dbgEl.textContent = log.join('\n'); if (DEBUG) dbgEl.hidden = false; }
  function fail(s) { dbgEl.classList.add('err'); say('FAIL: ' + s); modeEl.textContent = 'webgl · failed'; }

  say('v10 · cubes above sea · zoomed out');
  say('webgl1: ' + !!canvas.getContext('webgl'));
  say('webgl2: ' + !!canvas.getContext('webgl2'));
  if (!window.THREE) { fail('three.min.js missing — vendor/three.min.js not deployed'); return; }
  say('THREE: ' + THREE.REVISION);

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
  } catch (e) { fail('WebGLRenderer: ' + e.message); return; }
  if (!renderer.getContext()) { fail('no gl context from renderer'); return; }

  const gl = renderer.getContext();
  say('renderer ok · ctx ' + gl.getParameter(gl.VERSION));
  say('max texture: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE));

  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0x1a4080, 1);
  say('canvas px: ' + canvas.width + 'x' + canvas.height);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x3a78b8, 55, 160);
  const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 300);
  let activeStack = [];
  const SEA_Y = -10;
  const CUBE_BASE = 5;
  function fitCamera() {
    const layers = activeStack.length || 1;
    const dist = 32 + layers * 2.4;
    const midY = CUBE_BASE + layers * 0.38;
    camera.position.set(0, midY + 4, dist);
    camera.lookAt(0, midY, 0);
  }
  fitCamera();

  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(90, 36, 18, 0, Math.PI * 2, 0, Math.PI * 0.52),
    new THREE.MeshBasicMaterial({ color: 0x5aa8e8, side: THREE.BackSide, fog: false })
  );
  sky.position.y = -18;
  scene.add(sky);

  const STAR_N = 100;
  const starPos = new Float32Array(STAR_N * 3);
  const starCol = new Float32Array(STAR_N * 3);
  for (let i = 0; i < STAR_N; i++) {
    const theta = (i / STAR_N) * Math.PI * 2 * 7.3 + Math.random() * 0.4;
    const phi = 0.12 + Math.random() * 0.38;
    const r = 62 + Math.random() * 18;
    starPos[i * 3] = Math.cos(theta) * Math.sin(phi) * r;
    starPos[i * 3 + 1] = Math.cos(phi) * r + 8;
    starPos[i * 3 + 2] = Math.sin(theta) * Math.sin(phi) * r;
    const b = 0.75 + Math.random() * 0.25;
    starCol[i * 3] = b;
    starCol[i * 3 + 1] = b * (0.88 + Math.random() * 0.12);
    starCol[i * 3 + 2] = 1;
  }
  const stars = new THREE.Points(
    new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(starPos, 3))
      .setAttribute('color', new THREE.BufferAttribute(starCol, 3)),
    new THREE.PointsMaterial({ size: 0.42, vertexColors: true, transparent: true, opacity: 0.95, sizeAttenuation: true, fog: false })
  );
  scene.add(stars);
  say('sky · 100 stars');

  const sea = new THREE.Mesh(
    new THREE.CircleGeometry(90, 64),
    new THREE.MeshBasicMaterial({ color: 0x2a68a8, transparent: true, opacity: 0.35, depthWrite: false })
  );
  sea.rotation.x = -Math.PI / 2;
  sea.position.y = SEA_Y;
  scene.add(sea);

  const world = new THREE.Group();
  world.position.y = CUBE_BASE;
  scene.add(world);

  const grid = new THREE.GridHelper(28, 28, 0x504070, 0x281838);
  grid.position.y = SEA_Y + 0.05;
  scene.add(grid);

  const texCache = new Map();
  function hash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rgb(word) {
    const h = hash(word);
    return new THREE.Color(0.5 + (h & 255) / 400, 0.2 + ((h >> 8) & 255) / 500, 0.4 + ((h >> 16) & 255) / 450);
  }
  function wordTexture(word, color) {
    if (texCache.has(word)) return texCache.get(word);
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 256;
    const ctx = cv.getContext('2d');
    const r = (color.r * 255) | 0, g = (color.g * 255) | 0, b = (color.b * 255) | 0;
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = 'rgba(255,220,240,.5)';
    ctx.lineWidth = 8;
    ctx.strokeRect(12, 12, 232, 232);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let fs = 48;
    ctx.font = 'bold ' + fs + 'px system-ui';
    while (ctx.measureText(word).width > 210 && fs > 16) { fs -= 2; ctx.font = 'bold ' + fs + 'px system-ui'; }
    ctx.fillText(word, 128, 128);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    texCache.set(word, tex);
    return tex;
  }

  function clearWorld() {
    while (world.children.length) {
      const ch = world.children[0];
      world.remove(ch);
      ch.geometry?.dispose();
      if (ch.material) (Array.isArray(ch.material) ? ch.material : [ch.material]).forEach(m => m.dispose());
    }
  }

  function buildFromStack(stack) {
    clearWorld();
    activeStack = stack || [];
    let total = 0;
    let gi = 0;
    activeStack.forEach(function (row, li) {
      const words = (row.text || '').trim().split(/\s+/).filter(Boolean);
      const n = Math.max(words.length, 1);
      const ringRadius = 2.4 + li * 1.05;
      const ringY = li * 0.82;
      const ringSpin = li * 0.88;
      words.forEach(function (word, i) {
        const col = rgb(word + ':' + li);
        const mat = new THREE.MeshBasicMaterial({ map: wordTexture(word, col), toneMapped: false });
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
        const angle = ringSpin + (i / n) * Math.PI * 2;
        const wobble = (hash(word + gi) % 40) / 100;
        mesh.position.set(
          Math.cos(angle) * (ringRadius + wobble),
          ringY + Math.sin(i * 0.7 + li) * 0.28,
          Math.sin(angle) * (ringRadius + wobble)
        );
        mesh.scale.setScalar(0.48 + Math.min(0.7, word.length * 0.055));
        mesh.userData.phase = gi;
        world.add(mesh);
        total++;
        gi++;
      });
    });
    fitCamera();
    modeEl.textContent = 'webgl · stack ∞ · ' + total + ' cubes · ' + activeStack.length + ' lines · v10';
    say('stack ∞ · ' + activeStack.length + ' lines · ' + total + ' cubes');
  }

  let liveSig = '';
  async function pollLive() {
    try {
      const r = await fetch('textgl_live.json?' + Date.now());
      const j = await r.json();
      const stack = j.stack && j.stack.length ? j.stack : null;
      const sig = stack
        ? stack.map(function (row) { return row.hash || row.text; }).join('|')
        : 't:' + (j.text || '');
      if (sig !== liveSig) {
        liveSig = sig;
        if (stack) {
          buildFromStack(stack);
          ta.value = stack.map(function (row) { return row.text; }).join('\n');
        } else if (j.text) {
          buildFromStack([{ text: j.text, source: j.source || 'live' }]);
          ta.value = j.text;
        }
      }
    } catch (e) { say('poll err ' + e.message); }
  }
  setInterval(pollLive, 2500);
  pollLive();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    say('resize ' + canvas.width + 'x' + canvas.height);
  });

  let frames = 0;
  let pixelChecked = false;
  const t0 = performance.now();
  function tick() {
    const t = (performance.now() - t0) * 0.001;
    world.rotation.y = t * 0.3;
    world.rotation.x = 0.1 + Math.sin(t * 0.2) * 0.04;
    world.children.forEach(m => { m.rotation.y += 0.01; });
    stars.rotation.y = t * 0.015;
    renderer.render(scene, camera);
    frames++;

    if (!pixelChecked && frames === 3) {
      pixelChecked = true;
      const px = new Uint8Array(4);
      gl.readPixels((canvas.width / 2) | 0, (canvas.height / 2) | 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      const lum = px[0] + px[1] + px[2];
      say('frame ' + frames + ' · center px rgb=' + px[0] + ',' + px[1] + ',' + px[2] + ' lum=' + lum);
      if (lum < 15) {
        fail('center pixel still black — WebGL draws but scene invisible. Open textgl_debug.html');
        dbgEl.hidden = false;
      } else {
        say('render OK — cubes visible');
        if (!DEBUG) setTimeout(() => { dbgEl.hidden = true; }, 4000);
      }
    }
    requestAnimationFrame(tick);
  }

  pollLive();
  tick();
})();
  </script>
</body>
</html>
