<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>text → GL</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: #020008; color: #c8b0d0; font-family: system-ui, sans-serif; overflow: hidden; }

    #stage {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 50% 35%, #1a0828 0%, #020008 70%);
      overflow: hidden;
    }
    #stars {
      position: absolute; inset: 0; opacity: 0.55; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,180,220,.9) 50%, transparent 51%),
        radial-gradient(1px 1px at 30% 80%, rgba(180,140,255,.8) 50%, transparent 51%),
        radial-gradient(1px 1px at 70% 30%, rgba(255,120,180,.7) 50%, transparent 51%),
        radial-gradient(1px 1px at 85% 65%, rgba(200,160,255,.8) 50%, transparent 51%),
        radial-gradient(1px 1px at 50% 50%, rgba(255,200,230,.6) 50%, transparent 51%),
        radial-gradient(1px 1px at 20% 55%, rgba(160,100,200,.7) 50%, transparent 51%),
        radial-gradient(1px 1px at 60% 15%, rgba(255,150,200,.8) 50%, transparent 51%),
        radial-gradient(1px 1px at 90% 40%, rgba(180,120,220,.7) 50%, transparent 51%);
      background-size: 100% 100%;
      animation: drift 80s linear infinite;
    }
    @keyframes drift { to { transform: translate3d(-2%, -1%, 0); } }

    #grid {
      position: absolute; left: -50%; right: -50%; bottom: 18%;
      height: 60%; transform: rotateX(72deg);
      transform-origin: center bottom;
      background:
        linear-gradient(rgba(120,50,100,.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,50,100,.22) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent);
    }

    #scene {
      position: absolute; inset: 0;
      perspective: 1100px;
      perspective-origin: 50% 42%;
    }
    #world {
      position: absolute; left: 50%; top: 42%;
      width: 0; height: 0;
      transform-style: preserve-3d;
      animation: worldspin 28s linear infinite;
    }
    @keyframes worldspin {
      from { transform: rotateX(-12deg) rotateY(0deg); }
      to   { transform: rotateX(-12deg) rotateY(360deg); }
    }

    .wcube {
      position: absolute;
      transform-style: preserve-3d;
      left: 0; top: 0;
      animation: bob 3.6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translate3d(var(--tx), var(--ty), var(--tz)) translateY(0); }
      50%      { transform: translate3d(var(--tx), var(--ty), var(--tz)) translateY(-10px); }
    }

    .wcube .face {
      position: absolute;
      width: var(--sz); height: var(--sz);
      margin-left: calc(var(--sz) / -2);
      margin-top: calc(var(--sz) / -2);
      display: flex; align-items: center; justify-content: center;
      font-size: calc(var(--sz) * 0.17);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff4fa;
      text-shadow: 0 0 10px rgba(0,0,0,.8);
      border: 1px solid rgba(255,180,220,.35);
      backface-visibility: hidden;
      box-shadow: inset 0 0 18px rgba(255,120,180,.15);
    }
    .wcube .f-front  { transform: rotateY(0deg)    translateZ(calc(var(--sz) / 2)); background: var(--c1); }
    .wcube .f-back   { transform: rotateY(180deg)  translateZ(calc(var(--sz) / 2)); background: var(--c2); }
    .wcube .f-right  { transform: rotateY(90deg)   translateZ(calc(var(--sz) / 2)); background: var(--c2); }
    .wcube .f-left   { transform: rotateY(-90deg)  translateZ(calc(var(--sz) / 2)); background: var(--c2); }
    .wcube .f-top    { transform: rotateX(90deg)   translateZ(calc(var(--sz) / 2)); background: var(--c3); }
    .wcube .f-bottom { transform: rotateX(-90deg)  translateZ(calc(var(--sz) / 2)); background: var(--c3); }

    #c { display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

    .ui {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
      background: linear-gradient(transparent, rgba(2,0,8,.92) 30%);
      padding: 1rem 1rem 1.2rem; pointer-events: none;
    }
    .ui * { pointer-events: auto; }
    .row { display: flex; gap: .5rem; max-width: 48rem; margin: 0 auto; }
    textarea {
      flex: 1; min-height: 3.2rem; max-height: 8rem;
      background: rgba(20,8,24,.85); border: 1px solid rgba(200,100,160,.25);
      color: #f0d0e0; padding: .65rem .8rem; border-radius: 6px;
      font-size: .9rem; resize: vertical;
    }
    button {
      background: rgba(255,80,140,.2); border: 1px solid rgba(255,100,160,.45);
      color: #ff90b8; padding: 0 1rem; border-radius: 6px; cursor: pointer;
      font-size: .78rem; letter-spacing: .08em;
    }
    button:hover { background: rgba(255,80,140,.35); }
    .hint { text-align: center; font-size: .68rem; opacity: .65; margin-top: .45rem; }
    .mode { position: fixed; top: .8rem; left: .8rem; font-size: .65rem; opacity: .85; z-index: 2; }
    a { color: #7ab0d8; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="stars"></div>
    <div id="grid"></div>
    <div id="scene"><div id="world"></div></div>
  </div>
  <canvas id="c"></canvas>
  <p class="mode" id="mode">building…</p>
  <div class="ui">
    <div class="row">
      <textarea id="t" placeholder="type here — each word becomes a cube…"></textarea>
      <button type="button" id="go">BUILD</button>
    </div>
    <p class="hint">Type in the box · or edit <code>sleep_lira/play_input.txt</code> — auto-pushes every ~2s · <a href="textgl_live.json">textgl_live.json</a></p>
  </div>
  <script>
(function () {
  const world = document.getElementById('world');
  const modeEl = document.getElementById('mode');
  const ta = document.getElementById('t');

  function hash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function colors(word) {
    const h = hash(word);
    const r = Math.floor(120 + (h & 255) * 0.45);
    const g = Math.floor(40 + ((h >> 8) & 255) * 0.28);
    const b = Math.floor(90 + ((h >> 16) & 255) * 0.42);
    const c1 = 'rgb(' + r + ',' + g + ',' + b + ')';
    const c2 = 'rgb(' + Math.floor(r * 0.65) + ',' + Math.floor(g * 0.65) + ',' + Math.floor(b * 0.65) + ')';
    const c3 = 'rgb(' + Math.min(255, r + 40) + ',' + Math.min(255, g + 30) + ',' + Math.min(255, b + 50) + ')';
    return [c1, c2, c3];
  }

  function buildFromText(text) {
    world.innerHTML = '';
    const words = (text || '').trim().split(/\s+/).filter(Boolean);
    const n = Math.max(words.length, 1);

    words.forEach(function (word, i) {
      const [c1, c2, c3] = colors(word);
      const angle = (i / n) * Math.PI * 2 * 2.2;
      const radius = 180 + (i % 6) * 55;
      const tx = Math.cos(angle) * radius + 'px';
      const tz = Math.sin(angle) * radius + 'px';
      const ty = (Math.sin(i * 0.65) * 60 + i * 18 - n * 8) + 'px';
      const sz = (58 + Math.min(42, word.length * 7)) + 'px';

      const cube = document.createElement('div');
      cube.className = 'wcube';
      cube.style.setProperty('--tx', tx);
      cube.style.setProperty('--ty', ty);
      cube.style.setProperty('--tz', tz);
      cube.style.setProperty('--sz', sz);
      cube.style.setProperty('--c1', c1);
      cube.style.setProperty('--c2', c2);
      cube.style.setProperty('--c3', c3);
      cube.style.animationDelay = (i * 0.15) + 's';

      ['front', 'back', 'right', 'left', 'top', 'bottom'].forEach(function (face) {
        const f = document.createElement('div');
        f.className = 'face f-' + face;
        if (face === 'front') f.textContent = word;
        cube.appendChild(f);
      });
      world.appendChild(cube);
    });

    modeEl.textContent = '3d · ' + words.length + ' cube' + (words.length === 1 ? '' : 's') + ' · css world · v4';
  }

  function rebuild() { buildFromText(ta.value); }
  ta.addEventListener('input', rebuild);
  document.getElementById('go').onclick = rebuild;

  async function pollLive() {
    try {
      const r = await fetch('textgl_live.json?' + Date.now());
      const j = await r.json();
      if (j.text && j.text !== ta.dataset.live) {
        ta.dataset.live = j.text;
        ta.value = j.text;
        rebuild();
        modeEl.textContent = '3d · live · ' + (j.stamp || '');
      }
    } catch (_) {}
  }
  setInterval(pollLive, 2500);
  pollLive();

  ta.value = 'me and my Lira are playing :)';
  buildFromText(ta.value);
})();
  </script>
</body>
</html>
