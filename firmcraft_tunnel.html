<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firmcraft — Walk the Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080706;
      --ink: #f5f0e8;
      --cognac: #c9a062;
      --muted: rgba(245,240,232,0.58);
      --glass: rgba(8,7,6,0.55);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: auto !important; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    @keyframes scrollLine {
      0%   { transform: scaleY(0); transform-origin: top; }
      50%  { transform: scaleY(1); transform-origin: top; }
      51%  { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    .loader {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      background: var(--bg); transition: opacity 0.7s, visibility 0.7s;
    }
    .loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-mark {
      font-family: 'Cormorant Garamond', serif; font-size: 2rem;
      letter-spacing: 0.3em; text-transform: uppercase; color: var(--cognac);
    }

    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
    }
    .nav a { color: inherit; text-decoration: none; }
    .nav strong {
      font-family: 'Cormorant Garamond', serif; letter-spacing: 0.14em;
      text-transform: uppercase; font-size: 0.88rem;
    }
    .nav-cta {
      font-size: 0.55rem; letter-spacing: 0.16em; text-transform: uppercase;
      padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--cognac); color: var(--cognac);
    }

    #walk { position: relative; background: var(--bg); }

    .stage {
      position: sticky; top: 0;
      width: 100%; height: 100vh;
      overflow: hidden;
      perspective: 920px;
      perspective-origin: 50% 48%;
    }

    /* ── CORRIDOR GEOMETRY ── */
    .corridor {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transform-origin: 50% 48%;
      will-change: transform;
    }

    .hall-surface {
      position: absolute; pointer-events: none;
      backface-visibility: hidden;
    }

    .wall-l {
      left: 0; top: 0; bottom: 0; width: 34%;
      background: linear-gradient(90deg, #120f0c 0%, #1c1610 55%, transparent 100%);
      transform: rotateY(34deg) translateZ(40px);
      transform-origin: left center;
      box-shadow: inset -20px 0 60px rgba(0,0,0,0.6);
    }
    .wall-r {
      right: 0; top: 0; bottom: 0; width: 34%;
      background: linear-gradient(-90deg, #120f0c 0%, #1c1610 55%, transparent 100%);
      transform: rotateY(-34deg) translateZ(40px);
      transform-origin: right center;
      box-shadow: inset 20px 0 60px rgba(0,0,0,0.6);
    }
    .floor-hall {
      left: -15%; right: -15%; bottom: -5%; height: 42%;
      background:
        linear-gradient(180deg, transparent 0%, rgba(18,14,10,0.9) 40%),
        repeating-linear-gradient(90deg, rgba(201,160,98,0.04) 0 2px, transparent 2px 80px);
      transform: rotateX(72deg) translateZ(-80px);
      transform-origin: center bottom;
    }
    .ceiling-hall {
      left: -15%; right: -15%; top: -8%; height: 38%;
      background: linear-gradient(0deg, transparent 0%, rgba(6,5,4,0.95) 55%);
      transform: rotateX(-68deg) translateZ(-60px);
      transform-origin: center top;
    }

    .sconce {
      position: absolute; top: 38%; width: 8px; height: 8px; border-radius: 50%;
      background: radial-gradient(circle, #f0d8a8 0%, var(--cognac) 45%, transparent 70%);
      box-shadow: 0 0 24px 8px rgba(201,160,98,0.35);
      z-index: 6;
    }
    .sconce.l { left: 11%; }
    .sconce.r { right: 11%; }

    /* ── PORTALS: flat plane — NOT inside 3D corridor (prevents stretch) ── */
    .portal-plane {
      position: absolute; inset: 0; z-index: 10;
      display: grid; place-items: center;
      pointer-events: none;
    }

    .portal {
      position: absolute;
      left: 50%; top: 44%;
      width: min(64vw, 820px);
      aspect-ratio: 16 / 9;
      max-height: 50vh;
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      will-change: opacity;
      z-index: 1;
    }
    .portal.active { z-index: 3; }

    .portal-frame {
      width: 100%; height: 100%;
      border-radius: 8px;
      border: 1px solid rgba(201,160,98,0.32);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
      overflow: hidden;
      background: #100e0c;
      display: flex; align-items: center; justify-content: center;
      padding: 0.65rem;
    }

    .portal-frame video,
    .portal-frame .single img {
      display: block;
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      object-fit: contain;
      object-position: center;
    }

    .portal-frame .quad {
      width: 100%; height: 100%;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 0.45rem;
      align-content: center; justify-content: center;
    }
    .portal-frame .quad figure {
      margin: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.2); border-radius: 4px;
      overflow: hidden; min-height: 0; aspect-ratio: 3 / 4;
    }
    .portal-frame .quad img {
      display: block;
      max-width: 92%; max-height: 92%;
      width: auto; height: auto;
      object-fit: contain;
    }

    .tunnel-vig {
      position: absolute; inset: 0; z-index: 5; pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.5) 0%, transparent 18%, transparent 82%, rgba(0,0,0,0.5) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 14%, transparent 86%, rgba(0,0,0,0.4) 100%);
    }

    /* ── HOTEL-STYLE GLASS PANELS ── */
    .panels {
      position: absolute; inset: 0; z-index: 30;
      display: grid; grid-template-columns: minmax(220px, 1fr) 2fr minmax(220px, 1fr);
      pointer-events: none;
    }
    .panel-l, .panel-r {
      display: flex; align-items: center; padding: 4.5rem 1.25rem;
      pointer-events: auto;
    }
    .panel-l { justify-content: flex-start; padding-left: 2rem; }
    .panel-r { justify-content: flex-end; padding-right: 2rem; }

    .glass {
      max-width: 300px; padding: 1.5rem 1.65rem; border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.09); background: var(--glass);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 40px rgba(0,0,0,0.45);
      opacity: 0; transform: translateX(-18px);
      transition: opacity 0.5s, transform 0.5s;
    }
    .glass.right { transform: translateX(18px); }
    .glass.on { opacity: 1; transform: none; }

    .chapter {
      font-size: 0.48rem; letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--cognac); margin-bottom: 0.65rem;
    }
    h1, h2 {
      font-family: 'Cormorant Garamond', serif; font-weight: 400; line-height: 1.1;
      margin-bottom: 0.65rem;
    }
    h1 { font-size: clamp(1.6rem, 3.2vw, 2.6rem); }
    h2 { font-size: clamp(1.35rem, 2.6vw, 2rem); }
    h1 em { font-style: italic; color: var(--cognac); }
    .lead {
      font-size: 0.82rem; line-height: 1.7; color: var(--muted); font-weight: 300;
      margin-bottom: 0.9rem;
    }
    .btn {
      display: inline-block; font-size: 0.52rem; letter-spacing: 0.15em; text-transform: uppercase;
      padding: 0.6rem 1rem; border-radius: 999px; text-decoration: none;
      border: 1px solid var(--cognac); color: var(--cognac);
    }
    .btn.fill { background: var(--cognac); color: #14110d; }
    .notes { list-style: none; margin: 0.5rem 0 0.85rem; }
    .notes li {
      font-size: 0.72rem; color: var(--muted); margin-bottom: 0.35rem;
      padding-left: 0.85rem; position: relative;
    }
    .notes li::before {
      content: '◆'; position: absolute; left: 0; color: var(--cognac); font-size: 0.45rem; top: 0.15rem;
    }

    .rail {
      position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 400;
      display: flex; flex-direction: column; gap: 6px;
    }
    .rail i {
      display: block; width: 4px; height: 4px; border-radius: 50%;
      background: rgba(201,160,98,0.22); transition: all 0.35s;
    }
    .rail i.on { height: 18px; border-radius: 2px; background: var(--cognac); }

    .scroll-hint {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 400;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: none; transition: opacity 0.5s;
    }
    .scroll-hint.hide { opacity: 0; }
    .scroll-hint .line {
      width: 1px; height: 40px;
      background: linear-gradient(to bottom, transparent, var(--cognac));
      animation: scrollLine 2s ease-in-out infinite;
    }
    .scroll-hint span {
      font-size: 0.48rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted);
    }

    .outro {
      position: relative; z-index: 20; background: #f3efe8; color: #1a1816;
      padding: 3.5rem 1.5rem 3rem; border-top: 1px solid rgba(26,24,22,0.1);
    }
    .outro h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 1.8rem;
      text-align: center; margin-bottom: 1.5rem;
    }
    .mosaic {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem;
      max-width: 1000px; margin: 0 auto 1.5rem;
    }
    .mosaic img {
      width: 100%; aspect-ratio: 1; object-fit: contain;
      background: #ebe6dc; border-radius: 6px; border: 1px solid rgba(26,24,22,0.1);
    }
    .mosaic figcaption {
      font-size: 0.46rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: #7a746a; margin-top: 0.25rem; text-align: center;
    }
    .outro-cta { display: flex; justify-content: center; gap: 0.55rem; flex-wrap: wrap; }
    .outro-cta a {
      font-size: 0.54rem; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0.55rem 0.95rem; border-radius: 999px; border: 1px solid #8f6338;
      color: #8f6338; text-decoration: none;
    }

    @media (max-width: 800px) {
      .panels { grid-template-columns: 1fr; }
      .panel-r { display: none; }
      .panel-l { padding: 5rem 1rem 1rem; align-items: flex-end; }
      .glass { max-width: 100%; }
      .portal { width: min(88vw, 820px); max-height: 44vh; }
      .mosaic { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader"><div class="loader-mark">Firmcraft</div></div>
  <header class="nav">
    <a href="firmcraft.html"><strong>Firmcraft</strong></a>
    <a class="nav-cta" href="mailto:reviakinaes@gmail.com">Commission</a>
  </header>
  <div class="rail" id="rail"></div>
  <div class="scroll-hint" id="hint">
    <div class="line"></div>
    <span>Walk forward</span>
  </div>

  <section id="walk">
    <div class="stage" id="stage">
      <div class="corridor" id="corridor">
        <div class="hall-surface ceiling-hall"></div>
        <div class="hall-surface wall-l"></div>
        <div class="hall-surface wall-r"></div>
        <div class="hall-surface floor-hall"></div>
        <div class="sconce l"></div>
        <div class="sconce r"></div>
      </div>

      <div class="portal-plane" id="portalStack"></div>
      <div class="tunnel-vig"></div>

      <div class="panels">
        <div class="panel-l"><div class="glass" id="glassL"></div></div>
        <div></div>
        <div class="panel-r"><div class="glass right" id="glassR"></div></div>
      </div>
    </div>
  </section>

  <div class="outro">
    <h2>The complete collection</h2>
    <div class="mosaic" id="mosaic"></div>
    <div class="outro-cta">
      <a href="mailto:reviakinaes@gmail.com">Email Elena</a>
      <a href="https://www.instagram.com/firmangoods.official/" target="_blank" rel="noopener">Instagram</a>
      <a href="firmcraft.html">Classic layout</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
(function () {
  'use strict';
  const S = 'assets/firmcraft/site/';
  const Q = S + 'quads/';
  const V = 'assets/firmcraft/tunnel/';
  const C = '?v=11';
  const PX = 420;
  const EMAIL = 'reviakinaes@gmail.com';
  const VIDEO_MIN = 5_000_000;

  const CHAPTERS = [
    {
      id: 'threshold', chapter: '00 — Threshold',
      title: 'Soft leather for <em>everyday rituals.</em>', titleHtml: true,
      lead: 'Step into the atelier. Scroll forward — each doorway reveals the next room.',
      side: 'left',
      video: V + 'reel_00_hero.mp4' + C,
      poster: Q + 'quad_00_hero.jpg' + C,
      single: S + 'herobg.jpg' + C,
      cta: { label: 'Request a piece', href: 'mailto:' + EMAIL },
    },
    {
      id: 'carry', chapter: '01 — Carry',
      title: 'Wallets & daily forms',
      lead: 'Small pieces with soft edges — pocket rituals, saddle-stitch, custom colour.',
      notes: ['Bifold wallets', 'Card holders', 'Custom tones'],
      side: 'right',
      video: V + 'reel_01_carry.mp4' + C,
      poster: S + 'wallet.jpg' + C,
      single: S + 'wallet.jpg' + C,
      cta: { label: 'Request wallet', href: 'mailto:' + EMAIL + '?subject=Firmcraft%20wallet' },
    },
    {
      id: 'totes', chapter: '02 — Volume',
      title: 'Totes & shoulder bags',
      lead: 'Gentle structure, practical volume — relaxed silhouettes for market mornings.',
      notes: ['Soft handles', 'Curved flaps', 'Warm hardware'],
      side: 'left',
      single: S + 'tote.jpg' + C,
      video: V + 'trans_03_tote.mp4' + C,
      cta: { label: 'Request tote', href: 'mailto:' + EMAIL + '?subject=Firmcraft%20tote' },
    },
    {
      id: 'detail', chapter: '03 — Grain',
      title: 'Stitch & woven texture',
      lead: 'Edge finish, grain and weave — the quiet evidence of handwork.',
      side: 'right',
      video: V + 'reel_02_everyday.mp4' + C,
      poster: Q + 'quad_02_everyday.jpg' + C,
      quad: [
        [S + 'shopping.jpg' + C, 'Shopping'],
        [S + 'sleeve.jpg' + C, 'Sleeve'],
        [S + 'detail.jpg' + C, 'Detail'],
        [S + 'woven.jpg' + C, 'Woven'],
      ],
    },
    {
      id: 'crossbody', chapter: '04 — Movement',
      title: 'Crossbody & shopping',
      lead: 'Light, balanced forms for everyday movement — elegant volume without weight.',
      notes: ['Crossbody', 'Long-handle totes', 'Open market forms'],
      side: 'left',
      single: S + 'crossbody.jpg' + C,
      video: V + 'trans_06_crossbody.mp4' + C,
    },
    {
      id: 'maker', chapter: '05 — Maker',
      title: 'Elena Firman',
      lead: '“A piece should feel personal before it feels expensive.”',
      side: 'right',
      single: S + 'elena-author.jpg' + C,
      cta: { label: 'Instagram', href: 'https://www.instagram.com/firmangoods.official/', external: true },
    },
  ];

  const MOSAIC = [
    [S + 'wallet.jpg' + C, 'Wallet'], [S + 'tote.jpg' + C, 'Tote'],
    [S + 'bag.jpg' + C, 'Bag'], [S + 'crossbody.jpg' + C, 'Crossbody'],
    [S + 'shopping.jpg' + C, 'Shopping'], [S + 'sleeve.jpg' + C, 'Sleeve'],
    [S + 'detail.jpg' + C, 'Detail'], [S + 'woven.jpg' + C, 'Woven'],
    [S + 'herobg.jpg' + C, 'Atelier'], [S + 'elena-author.jpg' + C, 'Elena'],
  ];

  let STOPS = [];
  const portals = [];
  let activeVid = -1;
  let panelIdx = -1;

  async function videoReady(url) {
    if (!url) return false;
    try {
      const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
      if (!r.ok) return false;
      return parseInt(r.headers.get('content-length') || '0', 10) >= VIDEO_MIN;
    } catch { return false; }
  }

  async function resolveStops() {
    const out = [];
    for (const ch of CHAPTERS) {
      const stop = { ...ch };
      if (ch.video && await videoReady(ch.video)) {
        stop.mode = 'video';
        stop.poster = ch.poster || ch.single;
      } else if (ch.quad) {
        stop.mode = 'quad';
      } else {
        stop.mode = 'single';
      }
      out.push(stop);
    }
    return out;
  }

  function buildPortals() {
    const stack = document.getElementById('portalStack');
    const rail = document.getElementById('rail');
    stack.innerHTML = '';
    rail.innerHTML = '';
    portals.length = 0;

    STOPS.forEach((stop, i) => {
      const el = document.createElement('div');
      el.className = 'portal';
      const frame = document.createElement('div');
      frame.className = 'portal-frame';

      if (stop.mode === 'video') {
        const v = document.createElement('video');
        v.muted = true; v.loop = true; v.playsInline = true;
        v.preload = i < 3 ? 'auto' : 'metadata';
        v.poster = stop.poster;
        const src = document.createElement('source');
        src.src = stop.video;
        v.appendChild(src);
        frame.appendChild(v);
        portals[i] = { el, video: v };
      } else if (stop.mode === 'quad') {
        const grid = document.createElement('div');
        grid.className = 'quad';
        stop.quad.forEach(([src, cap]) => {
          const fig = document.createElement('figure');
          const img = document.createElement('img');
          img.src = src; img.alt = cap;
          fig.appendChild(img);
          grid.appendChild(fig);
        });
        frame.appendChild(grid);
        portals[i] = { el, video: null };
      } else {
        const wrap = document.createElement('div');
        wrap.className = 'single';
        const img = document.createElement('img');
        img.src = stop.single;
        img.alt = '';
        wrap.appendChild(img);
        frame.appendChild(wrap);
        portals[i] = { el, video: null };
      }

      el.appendChild(frame);
      stack.appendChild(el);
      rail.appendChild(document.createElement('i'));
    });
  }

  MOSAIC.forEach(([src, cap]) => {
    const fig = document.createElement('figure');
    fig.innerHTML = `<img src="${src}" alt="${cap}" loading="lazy"><figcaption>${cap}</figcaption>`;
    document.getElementById('mosaic').appendChild(fig);
  });

  function crossfadePortals(idx, blend) {
    STOPS.forEach((_, i) => {
      const P = portals[i];
      if (!P) return;
      let op = 0;
      if (i === idx) op = 1 - blend;
      else if (i === idx + 1 && blend > 0.08) op = blend;
      P.el.style.opacity = String(op);
      P.el.style.visibility = op > 0.04 ? 'visible' : 'hidden';
      P.el.classList.toggle('active', op > 0.5);

      if (P.video) {
        if (op > 0.2) {
          if (activeVid !== i) { P.video.currentTime = 0; activeVid = i; }
          if (P.video.paused) P.video.play().catch(() => {});
        } else if (op < 0.05) P.video.pause();
      }
    });
    document.getElementById('rail').querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i === idx));
  }

  function renderPanels(idx) {
    if (panelIdx === idx) return;
    panelIdx = idx;
    const ch = STOPS[idx];
    const L = document.getElementById('glassL');
    const R = document.getElementById('glassR');

    const title = ch.titleHtml ? `<h1>${ch.title}</h1>` : `<h2>${ch.title}</h2>`;
    const notes = ch.notes ? `<ul class="notes">${ch.notes.map(n => `<li>${n}</li>`).join('')}</ul>` : '';
    const cta = ch.cta
      ? `<a class="btn fill" href="${ch.cta.href}"${ch.cta.external ? ' target="_blank" rel="noopener"' : ''}>${ch.cta.label}</a>`
      : '';

    const main = `
      <p class="chapter">${ch.chapter}</p>
      ${title}
      <p class="lead">${ch.lead}</p>
      ${notes}${cta}`;

    L.className = 'glass';
    R.className = 'glass right';
    if (ch.side === 'right') {
      L.innerHTML = '';
      R.innerHTML = main;
      requestAnimationFrame(() => R.classList.add('on'));
      L.classList.remove('on');
    } else {
      R.innerHTML = '';
      L.innerHTML = main;
      requestAnimationFrame(() => L.classList.add('on'));
      R.classList.remove('on');
    }
  }

  gsap.registerPlugin(ScrollTrigger);
  let st;

  function mountWalk() {
    if (st) st.kill();
    const totalPx = STOPS.length * PX;
    document.getElementById('walk').style.minHeight = `calc(100vh + ${totalPx}px)`;

    st = ScrollTrigger.create({
      trigger: '#walk',
      start: 'top top',
      end: `+=${totalPx}`,
      pin: '#stage',
      pinSpacing: true,
      scrub: 0.4,
      anticipatePin: 1,
      onUpdate(self) {
        const p = self.progress;

        /* Walk corridor walls only — portals stay flat (no stretch) */
        const walkZ = p * 520;
        const walkScale = 1 + p * 0.1;

        document.getElementById('corridor').style.transform =
          `translateZ(${walkZ}px) scale(${walkScale})`;

        const f = p * (STOPS.length - 0.001);
        const idx = Math.min(STOPS.length - 1, Math.floor(f));
        crossfadePortals(idx, f - idx);
        renderPanels(idx);
        document.getElementById('hint').classList.toggle('hide', p > 0.035);
      },
    });
  }

  async function boot() {
    STOPS = await resolveStops();
    buildPortals();
    mountWalk();
    crossfadePortals(0, 0);
    renderPanels(0);
    portals[0]?.video?.play().catch(() => {});
    setTimeout(() => document.getElementById('loader').classList.add('done'), 500);
    ScrollTrigger.refresh();
  }

  window.addEventListener('load', () => boot().catch(() => boot()));
})();
