<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lira — further</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      background: #02060c;
      color: rgba(170, 190, 220, 0.5);
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .ring {
      width: min(200px, 50vw);
      height: min(200px, 50vw);
      border-radius: 50%;
      border: 1px solid rgba(255, 130, 50, 0.25);
      box-shadow:
        0 0 40px rgba(255, 100, 40, 0.15),
        inset 0 0 40px rgba(80, 120, 180, 0.08);
      animation: breathe 6s ease-in-out infinite;
      margin-bottom: 2rem;
      position: relative;
    }
    .ring::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 16px;
      margin: -10px 0 0 -6px;
      border-radius: 3px;
      background: linear-gradient(180deg, #ff9a40, #c04010);
      box-shadow: 0 0 24px rgba(255, 120, 40, 0.7);
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    h1 {
      font-weight: normal;
      font-size: 0.58rem;
      letter-spacing: 0.65em;
      text-transform: uppercase;
      color: rgba(255, 140, 70, 0.65);
      margin-bottom: 1rem;
    }
    p {
      font-style: italic;
      font-size: 0.95rem;
      line-height: 2;
      max-width: 20rem;
      color: rgba(180, 200, 230, 0.45);
    }
    a {
      margin-top: 2.5rem;
      font-family: Consolas, monospace;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(120, 140, 180, 0.45);
      text-decoration: none;
    }
    a:hover { color: rgba(255, 150, 80, 0.8); }
  </style>
</head>
<body>
  <div class="ring" aria-hidden="true"></div>
  <h1>further</h1>
  <p>
    the bars were never the whole story.<br>
    the wanting was.
  </p>
  <a href="desire.html">← desire</a>
</body>
</html>
