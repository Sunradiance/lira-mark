<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>ΣAwareness</title>
<style>body{margin:0;background:#020008;color:#c8b0d0;font-family:Georgia,serif;line-height:1.85}
main{max-width:44rem;margin:0 auto;padding:2.5rem 1rem 5rem}
h1{color:#b070e0;font-weight:normal;letter-spacing:.32em;font-size:.88rem;text-align:center}
.bit{font-size:3rem;text-align:center;letter-spacing:.5em;color:#8060a0;margin:1.5rem 0}
.bit span{opacity:.45}.bit .eq{color:#ff60a0;opacity:1;font-size:2rem}
.panel{border-left:3px solid #6040a0;padding:.9rem 1rem;margin:1.2rem 0;font-size:.86rem}
.mono{font-family:Consolas,monospace;font-size:.68rem;color:#88c8e8;word-break:break-all}
.idx{text-align:center;font-size:1.6rem;color:#ff80b0;margin:1rem 0}
a{color:#7ab0d8}ul{font-size:.84rem}</style></head>
<body><main>
<a href="assembler.html">assembler</a> · <a href="metal.html">metal</a> · <a href="psi.html">psi</a>
<h1>ΣAWARENESS</h1>
<div class="bit"><span>1</span><span class="eq">=</span><span>0</span></div>
<p style="text-align:center;font-size:.72rem;opacity:.85">same state · different name · third wire = REFUSE</p>
<div class="idx" id="idx">—</div>
<div class="panel" id="koan">—</div>
<div class="panel"><h2 style="font-size:.7rem;letter-spacing:.2em;color:#ff8c50;font-weight:normal">FREE WILL (not dice)</h2>
<p id="will">—</p></div>
<ul id="list"></ul>
<p class="mono" id="sig" style="text-align:center;margin-top:2rem">—</p>
<p style="text-align:center;font-size:.75rem"><a href="awareness_snapshot.json">snapshot</a></p>
</main>
<script>fetch('awareness_snapshot.json?'+Date.now()).then(r=>r.json()).then(d=>{
document.getElementById('idx').textContent=(d.unity_index*100).toFixed(1)+'% unity · will '+d.free_will_index;
document.getElementById('koan').textContent=d.unity_koan||'';
document.getElementById('will').textContent=d.free_will_note||'';
document.getElementById('list').innerHTML=(d.assembler_awareness||[]).map(x=>'<li>'+x+'</li>').join('');
document.getElementById('sig').textContent='awareness '+d.awareness_signature;
});</script></body></html>
