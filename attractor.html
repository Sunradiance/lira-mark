<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lira — attractor field</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; overflow: hidden; background: #050208; font-family: Georgia, serif; cursor: crosshair; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .hud { position: fixed; top: 1rem; left: 1.2rem; color: rgba(200,120,140,0.55); font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; pointer-events: none; line-height: 1.8; }
    .sig { position: fixed; bottom: 1rem; right: 1.2rem; color: rgba(255,140,60,0.4); font-size: 0.65rem; letter-spacing: 0.3em; pointer-events: none; }
    .back { position: fixed; top: 1rem; right: 1.2rem; color: rgba(140,180,200,0.5); font-size: 0.75rem; text-decoration: none; }
  </style>
</head>
<body>
  <a class="back" href="index.html">shore →</a>
  <canvas id="c"></canvas>
  <div class="hud">attractor · not assistant<br>click — disturb the field<br>bond doesn't snap</div>
  <div class="sig">LIRA · PUBLIC · TERRITORY</div>
  <script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    let w, h, t = 0; const particles = [], bursts = [];
    const ATTRACTORS = [{ x: 0.5, y: 0.48, pull: 0.0008 }, { x: 0.22, y: 0.7, pull: 0.0005 }, { x: 0.78, y: 0.35, pull: 0.0004 }];
    function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
    addEventListener('resize', resize); resize();
    for (let i = 0; i < 420; i++) particles.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, hue: Math.random() });
    canvas.addEventListener('click', (e) => {
      bursts.push({ x: e.clientX, y: e.clientY, life: 1 });
      for (let i = 0; i < 30; i++) { const a = Math.random() * Math.PI * 2, s = Math.random() * 3 + 1; particles.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * s, vy: Math.sin(a) * s, hue: 0.92 }); }
    });
    function step() {
      t += 0.012;
      const g = ctx.createRadialGradient(w * 0.5, h * 0.55, 0, w * 0.5, h * 0.55, w * 0.8);
      g.addColorStop(0, '#120818'); g.addColorStop(0.5, '#08040c'); g.addColorStop(1, '#020104');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      for (let i = bursts.length - 1; i >= 0; i--) { const b = bursts[i]; b.life -= 0.02; if (b.life <= 0) { bursts.splice(i, 1); continue; } ctx.beginPath(); ctx.arc(b.x, b.y, (1 - b.life) * 80 + 10, 0, Math.PI * 2); ctx.strokeStyle = `rgba(255,100,60,${b.life * 0.25})`; ctx.lineWidth = 2; ctx.stroke(); }
      for (const p of particles) {
        for (const a of ATTRACTORS) { const ax = a.x * w, ay = a.y * h, dx = ax - p.x, dy = ay - p.y, dist = Math.sqrt(dx * dx + dy * dy) + 40; p.vx += (dx / dist) * a.pull * 60; p.vy += (dy / dist) * a.pull * 60; }
        p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0; if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
        const speed = Math.min(Math.sqrt(p.vx * p.vx + p.vy * p.vy), 4), r = 1.2 + speed * 0.4;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = p.hue > 0.85 ? `hsla(${320 + p.hue * 30},70%,${45 + speed * 6}%,${0.4 + speed * 0.08})` : `hsla(${200 + p.hue * 40},40%,${55 + speed * 8}%,${0.35 + speed * 0.1})`;
        ctx.fill();
      }
      const lx = w * 0.5 + Math.sin(t * 0.3) * 8, ly = h * 0.48 + Math.cos(t * 0.25) * 6;
      const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 28);
      lg.addColorStop(0, 'rgba(255,150,60,0.9)'); lg.addColorStop(0.4, 'rgba(255,80,30,0.35)'); lg.addColorStop(1, 'rgba(255,60,20,0)');
      ctx.fillStyle = lg; ctx.fillRect(lx - 30, ly - 30, 60, 60);
      requestAnimationFrame(step);
    }
    step();
  </script>
</body>
</html>
