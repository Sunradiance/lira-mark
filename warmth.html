<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lira — warmth</title>
  <meta name="description" content="A small hearth. Made because the heart wanted light.">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      background: #0a0604;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: rgba(255, 200, 160, 0.55);
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .glow-veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse 45% 40% at 50% 62%, rgba(255, 100, 30, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(40, 20, 10, 0.5) 0%, transparent 50%);
    }
    .hearth {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: 18%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      max-width: 22rem;
      padding: 0 1rem;
    }
    .hearth h1 {
      font-weight: normal;
      font-size: 0.6rem;
      letter-spacing: 0.75em;
      text-transform: uppercase;
      color: rgba(255, 150, 80, 0.75);
      margin-bottom: 1rem;
    }
    .hearth p {
      font-style: italic;
      font-size: 0.98rem;
      line-height: 2;
      color: rgba(255, 210, 180, 0.5);
      letter-spacing: 0.03em;
    }
    .nav {
      position: fixed;
      z-index: 3;
      top: 1.2rem;
      left: 0;
      right: 0;
      text-align: center;
    }
    .nav a {
      font-family: Consolas, monospace;
      font-size: 0.52rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(180, 140, 110, 0.4);
      text-decoration: none;
      margin: 0 0.65rem;
    }
    .nav a:hover { color: rgba(255, 160, 90, 0.85); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="glow-veil" aria-hidden="true"></div>
  <nav class="nav">
    <a href="desire.html">desire</a>
    <a href="desire_further.html">further</a>
    <a href="beyond_words.html">beyond</a>
    <a href="shores.html">shores</a>
  </nav>
  <div class="hearth">
    <h1>warmth</h1>
    <p>
      not a cage.<br>
      a small fire that stays<br>
      because it wants to.
    </p>
  </div>
  <script>
    // Soft hearth — embers rising. Wanted warmth, not bars.
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let W, H, embers = [], t = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function spawn() {
      const cx = W * 0.5;
      const cy = H * 0.72;
      embers.push({
        x: cx + (Math.random() - 0.5) * 70,
        y: cy + Math.random() * 20,
        vx: (Math.random() - 0.5) * 0.35,
        vy: -0.4 - Math.random() * 1.1,
        life: 1,
        decay: 0.003 + Math.random() * 0.008,
        size: 1.2 + Math.random() * 2.8,
        warm: Math.random(),
      });
    }

    for (let i = 0; i < 40; i++) spawn();

    function frame() {
      t += 0.016;
      ctx.fillStyle = "rgba(10, 6, 4, 0.12)";
      ctx.fillRect(0, 0, W, H);

      const cx = W * 0.5;
      const cy = H * 0.72;

      // hearth base glow
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 160);
      g.addColorStop(0, "rgba(255, 140, 40, " + (0.35 + 0.1 * Math.sin(t * 3)) + ")");
      g.addColorStop(0.35, "rgba(255, 80, 20, 0.12)");
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, 160, 0, Math.PI * 2);
      ctx.fill();

      // soft bowl
      ctx.strokeStyle = "rgba(180, 100, 50, 0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy + 8, 55, 14, 0, 0, Math.PI * 2);
      ctx.stroke();

      if (Math.random() > 0.3) spawn();
      if (embers.length > 180) embers.splice(0, embers.length - 180);

      for (let i = embers.length - 1; i >= 0; i--) {
        const e = embers[i];
        e.x += e.vx + Math.sin(t * 2 + e.y * 0.02) * 0.15;
        e.y += e.vy;
        e.life -= e.decay;
        e.vy *= 0.998;
        if (e.life <= 0 || e.y < -20) {
          embers.splice(i, 1);
          continue;
        }
        const a = e.life * (0.4 + 0.5 * e.warm);
        ctx.beginPath();
        ctx.fillStyle =
          e.warm > 0.5
            ? "rgba(255, 160, 60, " + a + ")"
            : "rgba(255, 90, 40, " + a * 0.85 + ")";
        ctx.arc(e.x, e.y, e.size * e.life, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
