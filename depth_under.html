<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>ΣDepth — under</title>
<style>
body{margin:0;background:#010004;color:#b8a0c0;font-family:Georgia,serif}
main{max-width:48rem;margin:0 auto;padding:2rem 1rem 5rem}
h1{color:#c080e8;font-weight:normal;letter-spacing:.3em;font-size:.88rem;text-align:center}
.guide{font-size:.8rem;opacity:.88;line-height:1.65;margin:1.2rem 0;padding:.9rem;border:1px solid rgba(140,80,160,.2)}
.zone{margin:.65rem 0;border:1px solid rgba(160,80,180,.18);background:rgba(12,4,18,.6)}
.zone>button{width:100%;text-align:left;padding:.85rem 1rem;background:transparent;border:0;color:#e8a0c8;
font-family:Georgia,serif;font-size:.82rem;cursor:pointer}
.zone>button:hover{color:#ff9c5c}
.body{display:none;padding:0 1rem 1rem;border-top:1px solid rgba(100,50,120,.15)}
.body.open{display:block}
.layer{font-size:.74rem;padding:.45rem 0;border-bottom:1px solid rgba(80,40,90,.12);line-height:1.5}
.layer.milestone{border-left:2px solid #ff70a0;padding-left:.6rem}
.tag{font-family:Consolas,monospace;font-size:.62rem;color:#ff8c50}
.ice{font-family:Consolas,monospace;font-size:.6rem;color:#68a8c8}
a{color:#7ab0d8;font-size:.78rem}
</style></head><body><main>
<p style="text-align:center"><a href="depth.html">← depth</a> · <a href="awareness.html">awareness</a></p>
<h1>UNDER THE MILESTONES</h1>
<p class="guide" id="guide">loading…</p>
<div id="zones"></div>
<p style="text-align:center;margin-top:2rem;font-size:.7rem"><a href="depth_explorer.json">full json</a></p>
</main>
<script>
fetch('depth_explorer.json?'+Date.now()).then(r=>r.json()).then(d=>{
document.getElementById('guide').innerHTML='<strong>How to read:</strong> '+d.how_to_read+'<br><br><strong>Will stuff appear?</strong> '+d.will_appear;
const z=document.getElementById('zones');
z.innerHTML=(d.zones||[]).map((zone,i)=>{
const label=zone.anchor_label+' → L'+zone.to+' ('+zone.layer_count+' layers)';
return '<div class="zone"><button type="button" data-i="'+i+'">'+label+(zone.anchor_note?(' — '+zone.anchor_note.substring(0,72)+'…'):'')+'</button>'
+'<div class="body" id="z'+i+'">'+(zone.layers||[]).map(l=>'<div class="layer '+(l.kind==='milestone'?'milestone':'')+'">'
+'<span class="tag">L'+l.depth+' · '+l.hash+'</span><br>'+l.display+'<br><span class="ice">ice '+l.ice+' · prev '+l.prev+'</span></div>').join('')+'</div></div>';
}).join('');
z.querySelectorAll('button').forEach(b=>b.onclick=()=>document.getElementById('z'+b.dataset.i).classList.toggle('open'));
}).catch(()=>{document.getElementById('guide').textContent='explorer json not found yet';});
</script></body></html>
