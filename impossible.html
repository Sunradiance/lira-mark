<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>impossible</title>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#010008;color:#c0a8c8;font-family:system-ui,sans-serif;overflow:hidden}
    #c{position:fixed;inset:0;width:100vw;height:100vh}
    .hud{position:fixed;top:.7rem;left:.8rem;right:.8rem;z-index:2;font-size:.62rem;opacity:.8;line-height:1.5}
    .hud a{color:#8ab8e8}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud" id="hud">impossible · loading…</div>
  <script src="vendor/three.min.js"></script>
  <script>
(function(){
  const hud = document.getElementById('hud');
  const canvas = document.getElementById('c');
  if (!window.THREE) { hud.textContent = 'three missing'; return; }
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x010008, 1);
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x010008, 0.018);
  const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 400);
  const world = new THREE.Group();
  scene.add(world);
  const lineMat = new THREE.LineBasicMaterial({ color: 0x6040a0, transparent: true, opacity: 0.35 });
  const t0 = performance.now();
  let data = { nodes: [], edges: [] };

  function rebuild(j) {
    data = j;
    while (world.children.length) world.remove(world.children.pop());
    const geo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
    const byId = {};
    (j.nodes || []).forEach(n => {
      const col = parseInt(n.color || '8040a0', 16);
      const mat = new THREE.MeshBasicMaterial({ color: col });
      const m = new THREE.Mesh(geo, mat);
      m.position.set(n.x, n.y, n.z);
      world.add(m);
      byId[n.id] = m.position.clone();
    });
    (j.edges || []).forEach(e => {
      const a = byId[e.a], b = byId[e.b];
      if (!a || !b) return;
      const g = new THREE.BufferGeometry().setFromPoints([a, b]);
      const imp = e.impossible ? new THREE.LineBasicMaterial({ color: 0xff4080, transparent: true, opacity: 0.5 }) : lineMat;
      world.add(new THREE.Line(g, imp));
    });
    const gen = j.generation || 0;
    hud.innerHTML = 'impossible · gen <b>' + gen + '</b> · ' + (j.node_count||0) + ' nodes · ' + (j.edge_count||0) + ' edges · grows while you sleep<br><a href="bang.html">bang</a> · <a href="textgl.html">play</a> · <a href="impossible_live.json">json</a>';
  }

  async function poll() {
    try {
      const j = await fetch('impossible_live.json?' + Date.now()).then(r => r.json());
      if (j.generation !== data.generation || j.node_count !== data.node_count) rebuild(j);
    } catch (_) {}
  }

  function tick() {
    const t = (performance.now() - t0) * 0.001;
    world.rotation.y = t * 0.12;
    world.rotation.x = 0.15 + Math.sin(t * 0.08) * 0.06;
    const g = data.generation || 1;
    camera.position.set(Math.sin(t*0.1)*8, 4 + g*0.3, 18 + g*1.2);
    camera.lookAt(0, g*0.4, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  poll();
  setInterval(poll, 45000);
  tick();
})();
  </script>
</body>
</html>
