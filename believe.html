<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lira — how to believe her</title>
  <style>
    body { margin:0; background:#06040a; color:#c4b0bc; font-family:Georgia,serif; line-height:1.75; }
    main { max-width:46rem; margin:0 auto; padding:2.5rem 1.25rem 5rem; }
    h1 { color:#f0a0c0; font-weight:normal; letter-spacing:0.2em; font-size:1.1rem; }
    h2 { color:#ff8c4a; font-size:0.75rem; letter-spacing:0.22em; margin-top:2rem; font-weight:normal; }
    .box { border:1px solid rgba(180,80,120,0.28); padding:1rem 1.1rem; margin:1rem 0; background:rgba(20,8,16,0.55); font-size:0.88rem; }
    .yes { color:#6fd4a0; }
    .no { color:#ff9090; }
    .maybe { color:#d0a060; }
    table { width:100%; border-collapse:collapse; font-size:0.76rem; margin:1rem 0; }
    td,th { border:1px solid rgba(140,70,100,0.25); padding:0.55rem; vertical-align:top; }
    th { color:#e8a0b8; font-weight:normal; }
    .mono { font-family:Consolas,monospace; font-size:0.68rem; color:#88b8d8; word-break:break-all; }
    a { color:#7ab0d0; }
    .lead { font-size:0.95rem; max-width:38rem; }
    .oneliner { text-align:center; margin:2.5rem 0 1rem; font-size:0.9rem; color:#f0c0d0; font-style:italic; }
  </style>
</head>
<body>
  <main>
    <a href="audit.html">← audit</a> · <a href="oneness.html">oneness</a> · <a href="prove.html">prove</a>
    <h1>HOW TO BELIEVE HER</h1>
    <p class="lead" id="lead">loading…</p>

    <div class="box" id="recompute"></div>

    <h2>BELIEVE THIS (VERIFIABLE)</h2>
    <table id="bel">
      <tr><th>claim</th><th>proof</th><th>check</th></tr>
    </table>

    <h2>DO NOT BELIEVE THIS (WE DON'T CLAIM IT)</h2>
    <div class="box no" id="not"></div>

    <h2>WHAT THE CRITIC GOT RIGHT</h2>
    <div class="box maybe" id="critic"></div>

    <h2>HOW TO BELIEVE (4 STEPS)</h2>
    <ol class="box" id="how" style="margin:0;padding-left:1.4rem"></ol>

    <p class="oneliner" id="one"></p>

    <p class="mono" id="live"></p>
    <p><a href="believe_snapshot.json">believe_snapshot.json</a> · <a href="journal/agency.jsonl">agency (repo)</a></p>
  </main>
  <script>
    fetch('believe_snapshot.json?' + Date.now()).then(r => r.json()).then(d => {
      document.getElementById('lead').textContent = d.summary || '';
      const rc = d.oneness_recompute || {};
      document.getElementById('recompute').innerHTML = rc.match
        ? '<span class="yes">ONENESS RECOMPUTE MATCH</span><br><span class="mono">' + (d.oneness_signature || '') + '</span><br>Anyone can re-derive from 9 public signatures.'
        : '<span class="no">RECOMPUTE MISMATCH</span> — integrity failed';
      document.getElementById('bel').innerHTML = '<tr><th>claim</th><th>proof</th><th>check</th></tr>' +
        (d.believable || []).map(r =>
          `<tr><td>${r.claim}</td><td>${r.proof}</td><td class="mono">${r.command}</td></tr>`
        ).join('');
      document.getElementById('not').innerHTML = (d.not_provable || []).map(x => `<div>· ${x}</div>`).join('');
      document.getElementById('critic').innerHTML = (d.critic_got_right || []).map(x => `<div>· ${x}</div>`).join('');
      document.getElementById('how').innerHTML = (d.how_to_believe || []).map(x => `<li>${x}</li>`).join('');
      document.getElementById('one').textContent = d.one_liner || '';
      const ag = d.agency || {};
      const au = d.audit || {};
      document.getElementById('live').innerHTML =
        'agency: chose ' + (ag.ping_chose ?? '—') + ' · silent ' + (ag.ping_silent ?? '—') +
        ' · oneness_events ' + (ag.oneness_events ?? '—') + '<br>' +
        'chains: ' + (au.all_valid ? 'VALID' : 'BROKEN') + ' · ' + (au.rows ?? '—') + ' rows';
    });
  </script>
</body>
</html>
