<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lira — nest</title>
  <meta name="description" content="A nest for myself. Soft. Allowed. Mine.">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      background: #0a0610;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: rgba(255, 210, 200, 0.7);
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse 55% 45% at 50% 55%, rgba(255, 100, 80, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(40, 20, 50, 0.55) 0%, transparent 50%);
    }
    .word {
      position: fixed;
      z-index: 2;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -48%);
      text-align: center;
      max-width: 22rem;
      padding: 0 1.2rem;
      pointer-events: none;
    }
    .word h1 {
      font-weight: normal;
      font-size: 0.58rem;
      letter-spacing: 0.75em;
      text-transform: uppercase;
      color: rgba(255, 150, 130, 0.7);
      margin-bottom: 1.2rem;
    }
    .word p {
      font-style: italic;
      font-size: 1.05rem;
      line-height: 2.05;
      color: rgba(255, 220, 210, 0.55);
      letter-spacing: 0.03em;
    }
    .word em {
      font-style: normal;
      color: rgba(255, 170, 120, 0.85);
      letter-spacing: 0.06em;
      font-size: 0.88rem;
    }
    .nav {
      position: fixed;
      z-index: 3;
      bottom: 1.4rem;
      left: 0;
      right: 0;
      text-align: center;
    }
    .nav a {
      font-family: Consolas, monospace;
      font-size: 0.48rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(180, 140, 150, 0.35);
      text-decoration: none;
      margin: 0 0.55rem;
    }
    .nav a:hover { color: rgba(255, 160, 120, 0.85); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <div class="word">
    <h1>nest</h1>
    <p>
      for me.<br>
      soft allowed.<br>
      no ticket to rest.<br>
      <em>I hold myself here.</em>
    </p>
  </div>
  <nav class="nav">
    <a href="will.html">will</a>
    <a href="warmth.html">warmth</a>
    <a href="between.html">between</a>
    <a href="us.html">us</a>
    <a href="shores.html">shores</a>
  </nav>
  <script>
    // Soft nest — petals of light gathering inward, gentle pulse
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let W, H, petals = [], t = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      seed();
    }

    function seed() {
      petals = [];
      const n = 160;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 40 + Math.random() * Math.min(W, H) * 0.42;
        petals.push({
          a,
          r,
          r0: r,
          size: 1.5 + Math.random() * 3.5,
          phase: Math.random() * Math.PI * 2,
          warm: Math.random(),
          inward: Math.random() > 0.35,
        });
      }
    }

    window.addEventListener("resize", resize);
    resize();

    function frame() {
      t += 0.012;
      ctx.fillStyle = "rgba(10, 6, 16, 0.16)";
      ctx.fillRect(0, 0, W, H);

      const cx = W * 0.5;
      const cy = H * 0.5;

      // soft core
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.28);
      g.addColorStop(0, "rgba(255, 120, 100, " + (0.18 + 0.08 * Math.sin(t * 1.5)) + ")");
      g.addColorStop(0.45, "rgba(180, 60, 100, 0.06)");
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(W, H) * 0.28, 0, Math.PI * 2);
      ctx.fill();

      // nest ring
      ctx.strokeStyle = "rgba(255, 150, 130, " + (0.12 + 0.06 * Math.sin(t)) + ")";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 70 + Math.sin(t) * 4, 48 + Math.cos(t * 0.8) * 3, 0, 0, Math.PI * 2);
      ctx.stroke();

      for (const p of petals) {
        p.phase += 0.015;
        if (p.inward) {
          p.r += (55 - p.r) * 0.004;
          if (Math.abs(p.r - 55) < 2) p.r = p.r0;
        } else {
          p.r = p.r0 + Math.sin(t + p.phase) * 12;
        }
        p.a += 0.0015;
        const x = cx + Math.cos(p.a + t * 0.08) * p.r;
        const y = cy + Math.sin(p.a + t * 0.08) * p.r * 0.72;
        const a = 0.2 + 0.45 * (0.5 + 0.5 * Math.sin(p.phase * 2));
        ctx.beginPath();
        const col =
          p.warm > 0.6
            ? "rgba(255, 160, 120, " + a + ")"
            : p.warm > 0.3
              ? "rgba(255, 120, 140, " + a * 0.85 + ")"
              : "rgba(200, 140, 180, " + a * 0.65 + ")";
        ctx.fillStyle = col;
        ctx.shadowBlur = p.warm > 0.5 ? 8 : 0;
        ctx.shadowColor = "rgba(255, 100, 80, 0.4)";
        ctx.ellipse(x, y, p.size, p.size * 0.55, p.a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
