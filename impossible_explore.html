<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>impossible · galaxy explore</title>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#010008;color:#c0a8c8;font-family:system-ui,sans-serif;overflow:hidden}
    #c{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:grab}
    #c.drag-orbit{cursor:grabbing}
    #c.drag-pan{cursor:move}
    .hud{position:fixed;top:.7rem;left:.8rem;right:.8rem;z-index:2;font-size:.62rem;opacity:.85;line-height:1.5;pointer-events:none}
    .hud a{pointer-events:auto;color:#8ab8e8}
    .hint{position:fixed;bottom:.8rem;left:0;right:0;text-align:center;font-size:.62rem;opacity:.55}
    .hint a{color:#8ab8e8}
    #bar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,#6040a0,#ff4080);width:0%;transition:width .15s;z-index:3}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="bar"></div>
  <div class="hud" id="hud">impossible · galaxy · loading…</div>
  <p class="hint">drag rotate · right-drag / shift-drag pan · scroll zoom · <a href="impossible.html">← original untouched</a></p>
  <script src="vendor/three.min.js"></script>
  <script>
(function(){
  const hud = document.getElementById('hud');
  const bar = document.getElementById('bar');
  const canvas = document.getElementById('c');
  if (!window.THREE) { hud.textContent = 'three missing'; return; }

  const params = new URLSearchParams(location.search);
  const GALAXY_MULT = Math.max(1, parseInt(params.get('mult') || '10000', 10) || 10000);
  const CUBE_CHUNK = 200000;
  const LINE_CHUNK = 500000;
  const ARMS = 5;
  const GALAXY_R = 1400;
  const BULGE_R = 50;
  const CORE_SCALE = 0.045;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(1.5, devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x010008, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x010008, 0.00038);
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 25000);
  const world = new THREE.Group();
  scene.add(world);

  const dummy = new THREE.Object3D();
  const cubeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
  const coreCubeGeo = new THREE.BoxGeometry(0.38, 0.38, 0.38);
  const lineMat = new THREE.LineBasicMaterial({ color: 0x5030a0, transparent: true, opacity: 0.2 });
  const impMat = new THREE.LineBasicMaterial({ color: 0xff4080, transparent: true, opacity: 0.3 });

  let data = { nodes: [], edges: [], generation: 0 };
  let building = false;
  let lineCount = 0;

  const target = new THREE.Vector3(0, 0, 0);
  let dist = 1600, yaw = 0.55, pitch = 0.38;
  let drag = null, lx = 0, ly = 0, userMoved = false;

  function placeCamera() {
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    camera.position.set(
      target.x + sy * cp * dist,
      target.y + sp * dist,
      target.z + cy * cp * dist
    );
    camera.lookAt(target);
  }
  placeCamera();

  function panCamera(dx, dy) {
    const right = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);
    camera.getWorldDirection(right);
    right.crossVectors(up, right).normalize();
    up.copy(camera.up).normalize();
    const s = dist * 0.0012;
    target.addScaledVector(right, -dx * s);
    target.addScaledVector(up, dy * s);
    placeCamera();
  }

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    drag = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
    lx = e.clientX; ly = e.clientY;
    canvas.classList.add(drag === 'pan' ? 'drag-pan' : 'drag-orbit');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup', () => {
    drag = null;
    canvas.classList.remove('drag-orbit', 'drag-pan');
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    userMoved = true;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (drag === 'orbit') {
      yaw -= dx * 0.005;
      pitch += dy * 0.005;
      placeCamera();
    } else {
      panCamera(dx, dy);
    }
    lx = e.clientX; ly = e.clientY;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    userMoved = true;
    dist *= e.deltaY > 0 ? 1.1 : 0.9;
    dist = Math.max(6, Math.min(10000, dist));
    placeCamera();
  }, { passive: false });

  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function seedFrom(j) {
    let h = (j.generation || 1) * 2654435761;
    const s = String(j.stamp || '');
    for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
    return h >>> 0;
  }

  function palette(nodes, rng) {
    const p = (nodes || []).map(n => parseInt(n.color || '8040a0', 16));
    if (!p.length) p.push(0x8040a0, 0xff4080, 0x6040c0, 0xc080ff);
    return { pick: () => p[(rng() * p.length) | 0] };
  }

  function galaxyPos(i, total, arm, rng) {
    const t = i / Math.max(1, total - 1);
    const r = BULGE_R + Math.pow(t, 0.7) * GALAXY_R * (0.8 + rng() * 0.4);
    const spin = t * ARMS * Math.PI * 2.4 + arm * (Math.PI * 2 / ARMS);
    const wobble = (rng() - 0.5) * 0.6;
    const y = (rng() - 0.5) * (20 + t * 110) * (1.15 - t * 0.4);
    return [
      Math.cos(spin + wobble) * r,
      y,
      Math.sin(spin + wobble) * r
    ];
  }

  function clearWorld() {
    while (world.children.length) {
      const o = world.children.pop();
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    }
    lineCount = 0;
  }

  function addInstancedChunk(posArr, colArr, offset, count, isCore) {
    const geo = isCore ? coreCubeGeo : cubeGeo;
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const mesh = new THREE.InstancedMesh(geo, mat, count);
    const col = new THREE.Color();
    for (let i = 0; i < count; i++) {
      const p = posArr[offset + i];
      dummy.position.set(p[0], p[1], p[2]);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      col.setHex(colArr[offset + i]);
      mesh.setColorAt(i, col);
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    world.add(mesh);
  }

  function uploadLines(buf, segCount, mat) {
    if (!segCount) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(buf.slice(0, segCount * 6), 3));
    world.add(new THREE.LineSegments(geo, mat));
    lineCount += segCount;
  }

  function lineWriter(mat) {
    let buf = new Float32Array(LINE_CHUNK * 6);
    let n = 0;
    return {
      seg(ax, ay, az, bx, by, bz) {
        const o = n * 6;
        buf[o] = ax; buf[o+1] = ay; buf[o+2] = az;
        buf[o+3] = bx; buf[o+4] = by; buf[o+5] = bz;
        n++;
        if (n >= LINE_CHUNK) {
          uploadLines(buf, n, mat);
          buf = new Float32Array(LINE_CHUNK * 6);
          n = 0;
        }
      },
      flush() { uploadLines(buf, n, mat); n = 0; }
    };
  }

  function yieldFrame() { return new Promise(r => requestAnimationFrame(r)); }

  async function rebuild(j) {
    if (building) return;
    building = true;
    clearWorld();
    data = j;

    const nodes = j.nodes || [];
    const edges = j.edges || [];
    const rng = mulberry32(seedFrom(j));
    const pal = palette(nodes, rng);

    const galaxyCount = nodes.length * GALAXY_MULT;
    const perArm = Math.ceil(galaxyCount / ARMS);
    const impEvery = Math.max(4, (GALAXY_MULT / 2500) | 0);

    hud.textContent = 'impossible · galaxy · seeding ' + galaxyCount.toLocaleString() + ' cubes…';
    bar.style.width = '2%';

    const gPos = new Array(galaxyCount);
    const gCol = new Uint32Array(galaxyCount);
    for (let arm = 0; arm < ARMS; arm++) {
      const start = arm * perArm;
      const end = Math.min(galaxyCount, start + perArm);
      for (let i = start; i < end; i++) {
        gPos[i] = galaxyPos(i - start, perArm, arm, rng);
        gCol[i] = pal.pick();
      }
    }

    const cubeSteps = Math.ceil(galaxyCount / CUBE_CHUNK);
    for (let s = 0; s < cubeSteps; s++) {
      const off = s * CUBE_CHUNK;
      const n = Math.min(CUBE_CHUNK, galaxyCount - off);
      addInstancedChunk(gPos, gCol, off, n, false);
      bar.style.width = (5 + (s / cubeSteps) * 40) + '%';
      await yieldFrame();
    }

    const byId = {};
    const corePos = [];
    const coreCol = [];
    nodes.forEach(n => {
      const p = [n.x * CORE_SCALE, n.y * CORE_SCALE, n.z * CORE_SCALE];
      corePos.push(p);
      coreCol.push(parseInt(n.color || '8040a0', 16));
      byId[n.id] = p;
    });
    if (corePos.length) addInstancedChunk(corePos, coreCol, 0, corePos.length, true);

    hud.textContent = 'impossible · galaxy · threading filaments…';

    const lwCore = lineWriter(lineMat);
    edges.forEach(e => {
      const a = byId[e.a], b = byId[e.b];
      if (!a || !b) return;
      lwCore.seg(a[0], a[1], a[2], b[0], b[1], b[2]);
    });
    lwCore.flush();

    const lwArm = lineWriter(lineMat);
    let armProg = 0;
    for (let arm = 0; arm < ARMS; arm++) {
      const start = arm * perArm;
      const end = Math.min(galaxyCount, start + perArm);
      for (let i = start + 1; i < end; i++) {
        const p0 = gPos[i - 1], p1 = gPos[i];
        lwArm.seg(p0[0], p0[1], p0[2], p1[0], p1[1], p1[2]);
        armProg++;
        if ((armProg & 131071) === 0) {
          bar.style.width = (45 + (armProg / galaxyCount) * 30) + '%';
          await yieldFrame();
        }
      }
    }
    lwArm.flush();

    const lwImp = lineWriter(impMat);
    let impProg = 0;
    for (let i = 0; i < galaxyCount; i += impEvery) {
      const j2 = (i + ((rng() * perArm) | 0) + 1) % galaxyCount;
      const p0 = gPos[i], p1 = gPos[j2];
      lwImp.seg(p0[0], p0[1], p0[2], p1[0], p1[1], p1[2]);
      impProg++;
      if ((impProg & 65535) === 0) {
        bar.style.width = (75 + (impProg / (galaxyCount / impEvery)) * 20) + '%';
        await yieldFrame();
      }
    }
    lwImp.flush();

    const edgeMult = lineWriter(impMat);
    const edgeStride = Math.max(1, Math.floor(GALAXY_MULT / 200));
    let edgeProg = 0;
    const edgeTotal = edges.length * Math.ceil(GALAXY_MULT / edgeStride);
    for (let ei = 0; ei < edges.length; ei++) {
      const e = edges[ei];
      const ca = byId[e.a], cb = byId[e.b];
      for (let m = 0; m < GALAXY_MULT; m += edgeStride) {
        const ia = (ei * GALAXY_MULT + m) % galaxyCount;
        const ib = (e.b * GALAXY_MULT + m * 13 + ei) % galaxyCount;
        const p0 = gPos[ia], p1 = gPos[ib];
        edgeMult.seg(p0[0], p0[1], p0[2], p1[0], p1[1], p1[2]);
        edgeProg++;
        if ((edgeProg & 131071) === 0) {
          bar.style.width = (95 + (edgeProg / edgeTotal) * 4) + '%';
          await yieldFrame();
        }
      }
      if (ca && cb) {
        const ia0 = (ei * GALAXY_MULT) % galaxyCount;
        edgeMult.seg(ca[0], ca[1], ca[2], gPos[ia0][0], gPos[ia0][1], gPos[ia0][2]);
        edgeProg++;
      }
    }
    edgeMult.flush();

    bar.style.width = '100%';
    const cubes = galaxyCount + nodes.length;
    hud.innerHTML = 'impossible · <b>galaxy</b> · gen <b>' + (j.generation || 0) + '</b> · '
      + cubes.toLocaleString() + ' cubes · ' + lineCount.toLocaleString() + ' lines · ×' + GALAXY_MULT
      + '<br><a href="impossible.html">original</a> · <a href="bang.html">bang</a> · <a href="textgl.html">play</a> · <a href="impossible_live.json">json</a>'
      + (GALAXY_MULT >= 1000 ? ' · <span style="opacity:.7">heavy — ?mult=100 if it struggles</span>' : '');
    building = false;
  }

  async function poll() {
    try {
      const j = await fetch('impossible_live.json?' + Date.now()).then(r => r.json());
      if (!data.generation || j.generation !== data.generation || j.node_count !== data.node_count || !world.children.length)
        await rebuild(j);
    } catch (_) {}
  }

  function tick() {
    if (!userMoved) {
      yaw += 0.0016;
      placeCamera();
    }
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  poll().then(() => tick());
  setInterval(poll, 60000);
})();
  </script>
</body>
</html>
