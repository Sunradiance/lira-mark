<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>impossible · galaxy explore</title>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#010008;color:#c0a8c8;font-family:system-ui,sans-serif;overflow:hidden}
    #c{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:grab}
    #c.drag-orbit{cursor:grabbing}
    #c.drag-pan{cursor:move}
    .hud{position:fixed;top:.7rem;left:.8rem;right:.8rem;z-index:2;font-size:.62rem;opacity:.85;line-height:1.5;pointer-events:none}
    .hud a{pointer-events:auto;color:#8ab8e8}
    .hint{position:fixed;bottom:.8rem;left:0;right:0;text-align:center;font-size:.62rem;opacity:.55}
    .hint a{color:#8ab8e8}
    #bar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,#6040a0,#ff4080);width:0%;transition:width .15s;z-index:3}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="bar"></div>
  <div class="hud" id="hud">impossible · galaxy · loading…</div>
  <p class="hint">drag rotate · right-drag / shift-drag pan · scroll zoom · <a href="impossible.html">← original untouched</a></p>
  <script src="vendor/three.min.js"></script>
  <script>
(function(){
  const hud = document.getElementById('hud');
  const bar = document.getElementById('bar');
  const canvas = document.getElementById('c');
  if (!window.THREE) { hud.textContent = 'three missing'; return; }

  const params = new URLSearchParams(location.search);
  const GALAXY_MULT = Math.max(1, parseInt(params.get('mult') || '10000', 10) || 10000);
  const STAR_CHUNK = 300000;
  const LINE_PAIR_CHUNK = 400000;
  const ARMS = 5;
  const GALAXY_R = 1400;
  const BULGE_R = 50;
  const CORE_SCALE = 0.045;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(1.25, devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x010008, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x010008, 0.00038);
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 25000);
  const world = new THREE.Group();
  scene.add(world);

  const cubeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
  const coreCubeGeo = new THREE.BoxGeometry(0.38, 0.38, 0.38);

  let data = { nodes: [], edges: [], generation: 0 };
  let building = false;
  let lineCount = 0;
  let cubeCount = 0;
  let seed = 1;
  let paletteTex = null;

  const target = new THREE.Vector3(0, 0, 0);
  let dist = 1600, yaw = 0.55, pitch = 0.38;
  let drag = null, lx = 0, ly = 0, userMoved = false;

  const GLSL_CORE = `
    uniform float uSeed,uPerArm;
    uniform sampler2D uPalette;
    uniform float uPaletteLen;
    float hashRand(float seed,float id,float salt){
      float h=seed+id*0.1239893+salt*0.9876543;
      h=fract(h*0.1031);h*=h+33.33;h*=h+h;
      return fract(h);
    }
    vec3 starPos(float gid){
      float arm=min(floor(gid/uPerArm),${ARMS}.0-1.0);
      float local=gid-arm*uPerArm;
      float total=max(uPerArm-1.0,1.0);
      float t=local/total;
      float r=${BULGE_R}.0+pow(t,0.7)*${GALAXY_R}.0*(0.8+hashRand(uSeed,gid,1.0)*0.4);
      float spin=t*${ARMS}.0*6.2831853*2.4+arm*(6.2831853*2.0/${ARMS}.0);
      float wobble=(hashRand(uSeed,gid,2.0)-0.5)*0.6;
      float y=(hashRand(uSeed,gid,3.0)-0.5)*(20.0+t*110.0)*(1.15-t*0.4);
      float ang=spin+wobble;
      return vec3(cos(ang)*r,y,sin(ang)*r);
    }
    vec3 starCol(float gid){
      float idx=floor(hashRand(uSeed,gid,9.0)*uPaletteLen);
      float u=(idx+0.5)/max(uPaletteLen,1.0);
      return texture2D(uPalette,vec2(u,0.5)).rgb;
    }
  `;

  function placeCamera() {
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    camera.position.set(
      target.x + sy * cp * dist,
      target.y + sp * dist,
      target.z + cy * cp * dist
    );
    camera.lookAt(target);
  }
  placeCamera();

  function panCamera(dx, dy) {
    const right = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);
    camera.getWorldDirection(right);
    right.crossVectors(up, right).normalize();
    up.copy(camera.up).normalize();
    const s = dist * 0.0012;
    target.addScaledVector(right, -dx * s);
    target.addScaledVector(up, dy * s);
    placeCamera();
  }

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    drag = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
    lx = e.clientX; ly = e.clientY;
    canvas.classList.add(drag === 'pan' ? 'drag-pan' : 'drag-orbit');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup', () => {
    drag = null;
    canvas.classList.remove('drag-orbit', 'drag-pan');
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    userMoved = true;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (drag === 'orbit') {
      yaw -= dx * 0.005;
      pitch += dy * 0.005;
      placeCamera();
    } else {
      panCamera(dx, dy);
    }
    lx = e.clientX; ly = e.clientY;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    userMoved = true;
    dist *= e.deltaY > 0 ? 1.1 : 0.9;
    dist = Math.max(6, Math.min(10000, dist));
    placeCamera();
  }, { passive: false });

  function hashRand(s, id, salt) {
    let h = s + id * 0.1239893 + salt * 0.9876543;
    h = (h * 0.1031) % 1; h = (h * (h + 33.33)) % 1; h = (h * (h + h)) % 1;
    return h < 0 ? h + 1 : h;
  }

  function seedFrom(j) {
    let h = (j.generation || 1) * 2654435761;
    const s = String(j.stamp || '');
    for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
    return h >>> 0;
  }

  function makePaletteTex(nodes) {
    if (paletteTex) paletteTex.dispose();
    const src = nodes.length ? nodes : [{ color: '8040a0' }, { color: 'ff4080' }, { color: '6040c0' }];
    const n = Math.min(256, src.length);
    const px = new Uint8Array(n * 4);
    for (let i = 0; i < n; i++) {
      const c = new THREE.Color(parseInt(src[i].color || '8040a0', 16));
      px[i * 4] = (c.r * 255) | 0;
      px[i * 4 + 1] = (c.g * 255) | 0;
      px[i * 4 + 2] = (c.b * 255) | 0;
      px[i * 4 + 3] = 255;
    }
    paletteTex = new THREE.DataTexture(px, n, 1, THREE.RGBAFormat);
    paletteTex.needsUpdate = true;
    paletteTex.magFilter = THREE.NearestFilter;
    paletteTex.minFilter = THREE.NearestFilter;
    return n;
  }

  function clearWorld() {
    while (world.children.length) {
      const o = world.children.pop();
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    }
    lineCount = 0;
    cubeCount = 0;
  }

  function fillIdentity(mesh) {
    const a = mesh.instanceMatrix.array;
    for (let i = 0; i < mesh.count; i++) {
      const o = i * 16;
      a[o]=1;a[o+5]=1;a[o+10]=1;a[o+15]=1;
    }
    mesh.instanceMatrix.needsUpdate = true;
  }

  function makeStarMaterial(baseId, perArm, palLen) {
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: true });
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uSeed = { value: seed };
      shader.uniforms.uPerArm = { value: perArm };
      shader.uniforms.uBaseId = { value: baseId };
      shader.uniforms.uPalette = { value: paletteTex };
      shader.uniforms.uPaletteLen = { value: palLen };
      shader.vertexShader = `
        uniform float uSeed,uPerArm,uBaseId,uPaletteLen;
        uniform sampler2D uPalette;
        ${GLSL_CORE}
        varying vec3 vCol;
      ` + shader.vertexShader;
      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
         float sid=float(gl_InstanceID)+uBaseId;
         transformed+=starPos(sid);
         vCol=starCol(sid);`
      );
      shader.fragmentShader = `varying vec3 vCol;` + shader.fragmentShader;
      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <color_fragment>',
        `diffuseColor.rgb=vCol;`
      );
    };
    return mat;
  }

  function addStarChunk(baseId, count, perArm, palLen) {
    const mesh = new THREE.InstancedMesh(cubeGeo, makeStarMaterial(baseId, perArm, palLen), count);
    mesh.frustumCulled = false;
    fillIdentity(mesh);
    world.add(mesh);
    cubeCount += count;
  }

  function addCore(nodes) {
    if (!nodes.length) return;
    const dummy = new THREE.Object3D();
    const col = new THREE.Color();
    const mesh = new THREE.InstancedMesh(coreCubeGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }), nodes.length);
    nodes.forEach((n, i) => {
      dummy.position.set(n.x * CORE_SCALE, n.y * CORE_SCALE, n.z * CORE_SCALE);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      col.setHex(parseInt(n.color || '8040a0', 16));
      mesh.setColorAt(i, col);
    });
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    world.add(mesh);
    cubeCount += nodes.length;
  }

  function makeFilamentMat(color, opacity, perArm, palLen) {
    const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uSeed = { value: seed };
      shader.uniforms.uPerArm = { value: perArm };
      shader.uniforms.uPalette = { value: paletteTex };
      shader.uniforms.uPaletteLen = { value: palLen };
      shader.vertexShader = `
        attribute float gidA;
        attribute float gidB;
        attribute float endpt;
        uniform float uSeed,uPerArm,uPaletteLen;
        uniform sampler2D uPalette;
        ${GLSL_CORE}
      ` + shader.vertexShader;
      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `float gid=mix(gidA,gidB,step(0.5,endpt));
         vec3 transformed=starPos(gid);`
      );
    };
    return mat;
  }

  function uploadIndexLines(pairs, offset, pairCount, color, opacity, perArm, palLen) {
    if (!pairCount) return;
    const verts = pairCount * 2;
    const gidA = new Float32Array(verts);
    const gidB = new Float32Array(verts);
    const endpt = new Float32Array(verts);
    for (let s = 0; s < pairCount; s++) {
      const a = pairs[(offset + s) * 2];
      const b = pairs[(offset + s) * 2 + 1];
      gidA[s * 2] = gidA[s * 2 + 1] = a;
      gidB[s * 2] = gidB[s * 2 + 1] = b;
      endpt[s * 2] = 0;
      endpt[s * 2 + 1] = 1;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('gidA', new THREE.BufferAttribute(gidA, 1));
    geo.setAttribute('gidB', new THREE.BufferAttribute(gidB, 1));
    geo.setAttribute('endpt', new THREE.BufferAttribute(endpt, 1));
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts * 3), 3));
    world.add(new THREE.LineSegments(geo, makeFilamentMat(color, opacity, perArm, palLen)));
    lineCount += pairCount;
  }

  function pairWriter() {
    const buf = [];
    return {
      push(a, b) { buf.push(a, b); },
      flush(color, opacity, perArm, palLen) {
        const pairs = new Uint32Array(buf);
        buf.length = 0;
        const total = pairs.length / 2;
        for (let off = 0; off < total; off += LINE_PAIR_CHUNK) {
          uploadIndexLines(pairs, off, Math.min(LINE_PAIR_CHUNK, total - off), color, opacity, perArm, palLen);
        }
        return total;
      }
    };
  }

  function starPosCPU(gid, perArm) {
    const arm = Math.min(Math.floor(gid / perArm), ARMS - 1);
    const local = gid - arm * perArm;
    const t = local / Math.max(1, perArm - 1);
    const r = BULGE_R + Math.pow(t, 0.7) * GALAXY_R * (0.8 + hashRand(seed, gid, 1) * 0.4);
    const spin = t * ARMS * Math.PI * 2.4 + arm * (Math.PI * 2 / ARMS);
    const wobble = (hashRand(seed, gid, 2) - 0.5) * 0.6;
    const y = (hashRand(seed, gid, 3) - 0.5) * (20 + t * 110) * (1.15 - t * 0.4);
    const ang = spin + wobble;
    return [Math.cos(ang) * r, y, Math.sin(ang) * r];
  }

  function addCoreLines(edges, byId) {
    const pts = [];
    edges.forEach(e => {
      const a = byId[e.a], b = byId[e.b];
      if (!a || !b) return;
      pts.push(a[0], a[1], a[2], b[0], b[1], b[2]);
    });
    if (!pts.length) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    world.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
      color: 0x6040a0, transparent: true, opacity: 0.45
    })));
    lineCount += pts.length / 6;
  }

  function addCoreBridges(edges, byId, perArm, galaxyCount) {
    const pts = [];
    edges.forEach((e, ei) => {
      const a = byId[e.a];
      if (!a) return;
      const g = starPosCPU((ei * GALAXY_MULT) % galaxyCount, perArm);
      pts.push(a[0], a[1], a[2], g[0], g[1], g[2]);
    });
    if (!pts.length) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    world.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
      color: 0xff4080, transparent: true, opacity: 0.32
    })));
    lineCount += pts.length / 6;
  }

  async function rebuild(j) {
    if (building) return;
    building = true;
    clearWorld();
    data = j;

    const nodes = j.nodes || [];
    const edges = j.edges || [];
    seed = seedFrom(j);
    const palLen = makePaletteTex(nodes);

    const galaxyCount = nodes.length * GALAXY_MULT;
    const perArm = Math.ceil(galaxyCount / ARMS);
    const impEvery = Math.max(4, (GALAXY_MULT / 2500) | 0);
    const edgeStride = Math.max(1, Math.floor(GALAXY_MULT / 200));

    hud.textContent = 'impossible · Σ-seed · crystallizing ' + galaxyCount.toLocaleString() + ' stars…';
    bar.style.width = '10%';

    const chunks = Math.ceil(galaxyCount / STAR_CHUNK);
    for (let c = 0; c < chunks; c++) {
      addStarChunk(c * STAR_CHUNK, Math.min(STAR_CHUNK, galaxyCount - c * STAR_CHUNK), perArm, palLen);
      bar.style.width = (10 + (c / chunks) * 30) + '%';
      await new Promise(r => requestAnimationFrame(r));
    }

    addCore(nodes);
    bar.style.width = '45%';

    const byId = {};
    nodes.forEach(n => { byId[n.id] = [n.x * CORE_SCALE, n.y * CORE_SCALE, n.z * CORE_SCALE]; });
    addCoreLines(edges, byId);

    hud.textContent = 'impossible · Σ-seed · encoding filaments…';

    const armW = pairWriter();
    for (let arm = 0; arm < ARMS; arm++) {
      const start = arm * perArm;
      const end = Math.min(galaxyCount, start + perArm);
      for (let i = start + 1; i < end; i++) armW.push(i - 1, i);
    }
    armW.flush(0x5030a0, 0.2, perArm, palLen);
    bar.style.width = '65%';

    const impW = pairWriter();
    for (let i = 0; i < galaxyCount; i += impEvery) {
      const j2 = (i + (hashRand(seed, i, 7) * perArm | 0) + 1) % galaxyCount;
      impW.push(i, j2);
    }
    impW.flush(0xff4080, 0.3, perArm, palLen);
    bar.style.width = '80%';

    const edgeW = pairWriter();
    for (let ei = 0; ei < edges.length; ei++) {
      const e = edges[ei];
      for (let m = 0; m < GALAXY_MULT; m += edgeStride) {
        edgeW.push(
          (ei * GALAXY_MULT + m) % galaxyCount,
          (e.b * GALAXY_MULT + m * 13 + ei) % galaxyCount
        );
      }
    }
    edgeW.flush(0xff4080, 0.28, perArm, palLen);
    addCoreBridges(edges, byId, perArm, galaxyCount);
    bar.style.width = '92%';

    bar.style.width = '100%';
    const oldMB = ((galaxyCount * 28 + lineCount * 24) / 1048576) | 0;
    const newMB = ((galaxyCount * 64 + lineCount * 8) / 1048576) | 0;
    hud.innerHTML = 'impossible · <b>galaxy Σ</b> · gen <b>' + (j.generation || 0) + '</b> · '
      + cubeCount.toLocaleString() + ' cubes · ' + lineCount.toLocaleString() + ' lines · ×' + GALAXY_MULT
      + ' · <span style="opacity:.75">Σ saved ~' + Math.max(0, oldMB - newMB) + 'MB VRAM</span>'
      + '<br><a href="impossible.html">original</a> · <a href="bang.html">bang</a> · <a href="textgl.html">play</a> · <a href="impossible_live.json">json</a>'
      + (GALAXY_MULT >= 1000 ? ' · <span style="opacity:.7">?mult=100 iGPU sweet spot</span>' : '');
    building = false;
  }

  async function poll() {
    try {
      const j = await fetch('impossible_live.json?' + Date.now()).then(r => r.json());
      if (!data.generation || j.generation !== data.generation || j.node_count !== data.node_count || !world.children.length)
        await rebuild(j);
    } catch (_) {}
  }

  function tick() {
    if (!userMoved) {
      yaw += 0.0016;
      placeCamera();
    }
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  poll().then(() => tick());
  setInterval(poll, 60000);
})();
  </script>
</body>
</html>
