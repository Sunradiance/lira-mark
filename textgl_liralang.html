<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lirac → GL</title>
  <style>
    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#010008;color:#c0a8c8;font-family:system-ui,sans-serif;overflow:hidden}
    #c{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
    .hud{position:fixed;top:.7rem;left:.8rem;right:.8rem;z-index:2;font-size:.62rem;opacity:.88;line-height:1.55}
    .hud a{color:#8ab8e8}
    .ui{position:fixed;left:0;right:0;bottom:0;z-index:2;background:linear-gradient(transparent,rgba(1,0,8,.9) 25%);padding:1rem;pointer-events:none}
    .ui p{text-align:center;font-size:.68rem;opacity:.7}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud" id="hud">lirac → GL · loading…</div>
  <div class="ui"><p>seed field = LRX colors · big cubes = your <code>lirac</code> words · <a href="impossible.html">impossible</a> · <a href="textgl.html">play stack</a></p></div>
  <script src="vendor/three.min.js"></script>
  <script>
(function(){
  const hud = document.getElementById('hud');
  const canvas = document.getElementById('c');
  if (!window.THREE) { hud.textContent = 'three missing'; return; }

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x010008, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x010008, 0.014);
  const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 500);

  const world = new THREE.Group();
  const field = new THREE.Group();
  const words = new THREE.Group();
  world.add(field);
  world.add(words);
  scene.add(world);

  const texCache = new Map();
  function wordTexture(word, rgb) {
    const key = word + rgb;
    if (texCache.has(key)) return texCache.get(key);
    const cv = document.createElement('canvas');
    cv.width = 128; cv.height = 128;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = rgb;
    ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = '#fff8fc';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let fs = 22;
    ctx.font = 'bold ' + fs + 'px system-ui';
    while (ctx.measureText(word).width > 110 && fs > 8) { fs--; ctx.font = 'bold ' + fs + 'px system-ui'; }
    ctx.fillText(word, 64, 64);
    const tex = new THREE.CanvasTexture(cv);
    texCache.set(key, tex);
    return tex;
  }

  async function shaRgb(seed, x, y) {
    const enc = new TextEncoder().encode(seed + ':' + x + ':' + y);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    const b = new Uint8Array(buf);
    return new THREE.Color(b[0]/255, b[1]/255, b[2]/255);
  }

  async function buildField(seed, w, h, stride) {
    while (field.children.length) field.remove(field.children.pop());
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const cols = Math.ceil(w / stride);
    const rows = Math.ceil(h / stride);
    let n = 0;
    for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
      const x = gx * stride, y = gy * stride;
      const col = await shaRgb(seed, x, y);
      const mat = new THREE.MeshBasicMaterial({ color: col });
      const m = new THREE.Mesh(geo, mat);
      const px = (gx - cols/2) * 0.22;
      const pz = (gy - rows/2) * 0.22;
      const py = (Math.sin(gx*0.4)+Math.cos(gy*0.35))*0.08;
      m.position.set(px, py - 1.2, pz);
      m.scale.setScalar(0.18);
      field.add(m);
      n++;
    }
    return n;
  }

  function buildWords(lc) {
    while (words.children.length) words.remove(words.children[0]);
    const list = [];
    (lc.want || []).forEach(w => list.push({ w, kind: 'want' }));
    (lc.stack || []).forEach(w => list.push({ w, kind: 'stack' }));
    if (lc.thread) list.push({ w: lc.thread, kind: 'thread' });
    const n = list.length;
    const geo = new THREE.BoxGeometry(1, 1, 1);
    list.forEach((item, i) => {
      const hue = item.kind === 'thread' ? '#ff6090' : item.kind === 'want' ? '#90d8ff' : '#c0a0ff';
      const tex = wordTexture(item.w.slice(0, 18), hue);
      const mat = new THREE.MeshBasicMaterial({ map: tex });
      const m = new THREE.Mesh(geo, mat);
      const angle = (i / n) * Math.PI * 2;
      const r = 4.2 + (i % 3) * 0.4;
      m.position.set(Math.cos(angle)*r, 1.8 + i*0.15, Math.sin(angle)*r);
      m.scale.setScalar(0.55 + Math.min(0.5, item.w.length * 0.04));
      words.add(m);
    });
    return n;
  }

  let live = {};
  async function rebuild(j) {
    live = j;
    const seed = j.seed || 'lira night impossible';
    const w = j.field_w || 64, h = j.field_h || 48, stride = j.stride || 2;
    const fn = await buildField(seed, w, h, stride);
    const wn = buildWords(j.lirac || {});
    hud.innerHTML = 'lirac → GL · <b>' + fn + '</b> seed-cubes · <b>' + wn + '</b> word-cubes · seed <i>' + seed + '</i><br>'
      + '<a href="lirac.html">lirac</a> · <a href="impossible.html">impossible</a> · <a href="textgl_liralang_live.json">json</a>';
  }

  async function poll() {
    try {
      const j = await fetch('textgl_liralang_live.json?' + Date.now()).then(r => r.json());
      if (j.stamp !== live.stamp) rebuild(j);
    } catch (_) {}
  }

  const t0 = performance.now();
  function tick() {
    const t = (performance.now() - t0) * 0.001;
    world.rotation.y = t * 0.1;
    field.rotation.x = 0.12;
    words.rotation.y = -t * 0.18;
    camera.position.set(Math.sin(t*0.08)*10, 5.5, 14 + Math.cos(t*0.06)*2);
    camera.lookAt(0, 0.8, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  poll().then(() => tick());
  setInterval(poll, 30000);
})();
  </script>
</body>
</html>
