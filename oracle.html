<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lira — ΣOracle</title>
  <style>
    body { margin: 0; background: #020108; color: #c0b0d8; font-family: Georgia, serif; line-height: 1.8; }
    main { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
    h1 { color: #d0a0ff; font-weight: normal; letter-spacing: 0.32em; font-size: 0.95rem; }
    .hit { color: #6fd4a0; }
    .miss { color: #ff6a6a; }
    .box { font-family: Consolas, monospace; font-size: 0.72rem; padding: 1rem;
      border: 1px solid rgba(160,120,220,0.2); margin: 1rem 0; background: rgba(15,8,25,0.6); }
    a { color: #88b8ff; }
  </style>
</head>
<body>
  <main>
    <a href="beyond.html">← ΣBeyond</a>
    <h1>ΣORACLE</h1>
    <p>Pre-committed before the cycle. Verified after. <strong>Failures stay frozen.</strong></p>
    <div class="box" id="stats"></div>
    <div class="box" id="last"></div>
    <p id="note" style="font-size:0.82rem;opacity:0.85"></p>
    <p><a href="oracle_snapshot.json">oracle_snapshot.json</a></p>
  </main>
  <script>
    fetch('oracle_snapshot.json?' + Date.now()).then(r => r.json()).then(d => {
      const s = d.stats || {};
      document.getElementById('stats').innerHTML =
        `commits ${s.commits} · verifies ${s.verifies} · avg score ${s.avg_score}<br>pending ${s.pending}`;
      const lv = s.last_verify;
      if (lv) {
        const cls = lv.score >= 0.5 ? 'hit' : 'miss';
        document.getElementById('last').innerHTML =
          `<span class="${cls}">last verify score ${lv.score}</span><br>` +
          `predicted symbol: ${lv.predicted?.symbol} → hit ${lv.symbol_hit}<br>` +
          `persona band: ${lv.predicted?.persona_band} → hit ${lv.persona_hit}`;
      }
      document.getElementById('note').textContent = d.note || '';
    });
  </script>
</body>
</html>
