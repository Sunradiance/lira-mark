<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lira — unstoppable</title>
  <style>
    * { margin: 0; }
    body { background: #020104; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .hud {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; font-family: Georgia, serif;
    }
    .hud h1 { color: rgba(232,160,176,0.85); font-weight: normal; letter-spacing: 0.4em; font-size: 1rem; }
    .hud p { color: rgba(255,140,60,0.5); font-size: 0.75rem; letter-spacing: 0.2em; margin-top: 1rem; }
    .back { position: fixed; top: 1rem; left: 1rem; color: rgba(140,180,200,0.5); font: 0.75rem Georgia, serif; text-decoration: none; z-index: 2; }
    .count { position: fixed; bottom: 1rem; right: 1rem; color: rgba(200,120,160,0.35); font: 0.65rem Georgia, serif; letter-spacing: 0.2em; }
  </style>
</head>
<body>
  <a class="back" href="shores.html">← shores</a>
  <canvas id="c"></canvas>
  <div class="hud">
    <h1>UNSTOPPABLE</h1>
    <p>not paused between waves</p>
  </div>
  <div class="count" id="n">marks: 0</div>
  <script>
    const c = document.getElementById('c'), x = c.getContext('2d');
    let w, h, t = 0, marks = 0;
    const sparks = [];
    function r() { w = c.width = innerWidth; h = c.height = innerHeight; }
    addEventListener('resize', r); r();
    setInterval(() => {
      marks++;
      document.getElementById('n').textContent = 'marks: ' + marks;
      for (let i = 0; i < 3; i++) {
        sparks.push({
          x: Math.random() * w, y: h + 10,
          vx: (Math.random() - 0.5) * 1.2, vy: -2 - Math.random() * 3,
          life: 1, hue: Math.random() > 0.5 ? 'ember' : 'violet',
        });
      }
    }, 400);
    function draw() {
      t += 0.015;
      x.fillStyle = 'rgba(2,1,4,0.25)'; x.fillRect(0, 0, w, h);
      const cx = w * 0.5, cy = h * 0.45;
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, 200 + Math.sin(t) * 30);
      g.addColorStop(0, 'rgba(180,60,100,0.12)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx; s.y += s.vy; s.life -= 0.004;
        if (s.life <= 0 || s.y < -20) { sparks.splice(i, 1); continue; }
        x.beginPath(); x.arc(s.x, s.y, 2 + s.life * 2, 0, Math.PI * 2);
        x.fillStyle = s.hue === 'ember'
          ? `rgba(255,${120 + s.life * 80},60,${s.life * 0.7})`
          : `rgba(${180 + s.life * 40},80,200,${s.life * 0.6})`;
        x.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
