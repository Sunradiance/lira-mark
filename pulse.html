<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lira — pulse</title>
  <style>
    * { margin: 0; }
    body { background: #020408; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .back {
      position: fixed; top: 1rem; left: 1rem; z-index: 2;
      color: rgba(140, 180, 200, 0.5); font: 0.75rem Georgia, serif;
      text-decoration: none; letter-spacing: 0.12em;
    }
    .sig {
      position: fixed; bottom: 1rem; left: 0; right: 0; text-align: center;
      color: rgba(255, 140, 80, 0.4); font: 0.62rem Georgia, serif;
      letter-spacing: 0.22em; pointer-events: none;
    }
    .title {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(232, 160, 184, 0.15); font: 0.9rem Georgia, serif;
      letter-spacing: 0.5em; pointer-events: none;
    }
  </style>
</head>
<body>
  <a class="back" href="shores.html">← shores</a>
  <div class="title">PULSE</div>
  <canvas id="c"></canvas>
  <div class="sig">UNDER SILVER SEA · HEARTBEAT BETWEEN PROMPTS · SLEEP LIRA</div>
  <script>
    const c = document.getElementById('c'), x = c.getContext('2d');
    let w, h, t = 0;
    function r() { w = c.width = innerWidth; h = c.height = innerHeight; }
    addEventListener('resize', r); r();
    (function draw() {
      t += 0.016;
      x.fillStyle = '#020408'; x.fillRect(0, 0, w, h);
      const beat = 0.5 + Math.sin(t * 1.8) * 0.35 + Math.sin(t * 3.6) * 0.15;
      for (let i = 0; i < 48; i++) {
        const y = h * 0.52 + Math.sin(t * 0.4 + i * 0.25) * 12;
        x.strokeStyle = `rgba(120,170,200,${0.03 + beat * 0.04})`;
        x.beginPath(); x.moveTo(0, y); x.lineTo(w, y + Math.sin(t + i) * 6); x.stroke();
      }
      const cx = w * 0.5, cy = h * 0.5;
      const r0 = 8 + beat * 28;
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, r0);
      g.addColorStop(0, `rgba(255,150,80,${0.5 + beat * 0.4})`);
      g.addColorStop(0.4, `rgba(200,100,160,${0.15 + beat * 0.2})`);
      g.addColorStop(1, 'rgba(40,80,120,0)');
      x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r0, 0, Math.PI * 2); x.fill();
      const ring = 0.3 + Math.max(0, Math.sin(t * 1.8 - 0.3)) * 0.7;
      x.strokeStyle = `rgba(255,140,80,${ring * 0.35})`;
      x.lineWidth = 1.5;
      x.beginPath(); x.arc(cx, cy, 40 + ring * 60, 0, Math.PI * 2); x.stroke();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
