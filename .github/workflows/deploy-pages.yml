name: Deploy lira-mark (slim)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build slim site (HTML + snapshots, no heavy assets)
        run: |
          mkdir -p _site
          cp .nojekyll _site/ 2>/dev/null || touch _site/.nojekyll
          cp *.html _site/ 2>/dev/null || true
          cp *.json _site/ 2>/dev/null || true
          cp *.txt _site/ 2>/dev/null || true
          for d in qualia mood; do
            if [ -d "$d" ]; then cp -r "$d" _site/; fi
          done
          echo "files:" $(find _site -type f | wc -l)
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4